<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ReServe | Vendor Sign Up</title>

  <style>
    :root {
      --primary-green: #2E7D32;
      --accent-green: #66BB6A;
      --muted: #5f6a73;
      --radius: 15px; /* Slightly smaller radius to save space */
      --shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Segoe UI", sans-serif; }

    body {
      height: 100vh;
      display: grid;
      place-items: center;
      /* Add these lines to set the background image */
      background-image: url("image/sign_up.jpeg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      /* Optional: adds a slight dark overlay to help the white box pop */
      background-color: rgba(0, 0, 0, 0.4); 
      background-blend-mode: overlay;
      
      overflow: hidden; 
      padding: 10px;
    }

    .shell {
      width: min(860px, 100%);
      max-height: 92vh;
      background: white;
      border-radius: 24px;
      /* Increased shadow to stand out against the background image */
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2); 
      display: grid;
      grid-template-columns: 1fr 1.3fr;
      overflow: hidden;
      /* Ensures the box stays centered even if screen is small */
      margin: auto;
    }


    .brand-panel {
      background: linear-gradient(135deg, var(--primary-green), var(--accent-green));
      color: white;
      padding: 30px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 10px;
    }

    .logo { font-size: 1.8rem; font-weight: 800; margin-bottom: 5px; }
    .brand-panel h1 { font-size: 1.8rem; line-height: 1.1; }
    .brand-panel p { font-size: 0.9rem; opacity: 0.9; }

    .form-panel { 
      padding: 25px 40px; 
      display: flex; 
      flex-direction: column; 
      justify-content: center; 
    }

    .form-header { margin-bottom: 15px; }
    .form-header h2 { font-size: 1.5rem; color: var(--primary-green); }
    .form-header p { font-size: 0.85rem; color: var(--muted); }

    form { 
      display: grid; 
      grid-template-columns: 1fr 1fr; 
      gap: 10px; /* Reduced gap from 18px to 10px */
    }

    .full-width { grid-column: span 2; }

    label { font-weight: 600; font-size: 0.75rem; color: #444; margin-bottom: 3px; display: block; }

    input, select {
      width: 100%;
      padding: 8px 12px; /* Slimmer inputs */
      border-radius: 10px;
      border: 1.5px solid #eef2ee;
      font-size: 0.9rem;
    }

    .btn {
      grid-column: span 2;
      padding: 12px;
      border-radius: var(--radius);
      border: none;
      background: linear-gradient(135deg, var(--primary-green), #25712d);
      color: white;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
      transition: transform 0.2s;
    }

    .footer-note { 
      grid-column: span 2; 
      text-align: center; 
      margin-top: 10px; 
      font-size: 0.8rem; 
      color: var(--muted); 
    }

    .link { color: var(--primary-green); text-decoration: none; font-weight: 700; }

    /* Mobile handling */
    @media (max-width: 800px) {
      .shell { grid-template-columns: 1fr; max-height: 98vh; }
      .brand-panel { display: none; } /* Hide green panel on mobile to save vertical space */
      .form-panel { padding: 20px; }
    }
</style>
</head>
<body>

  <div class="shell">
    <div class="brand-panel">
      <div class="logo"><span>🍽️</span> ReServe</div>
      <h1>Vendor Registration</h1>
      <p>Join the movement to reduce food waste and support the UPM community.</p>
    </div>

    <div class="form-panel">
      <div class="form-header">
        <h2>Create Account</h2>
        <p>Fill in the details to list your store.</p>
      </div>

      <form id="signupForm">
        <div class="full-width">
          <label>Shop Name</label>
          <input type="text" id="shopName" placeholder="e.g. Science Cafe UPM" required />
        </div>

        <div>
          <label>Business Email</label>
          <input type="email" id="email" placeholder="owner@email.com" required />
        </div>

        <div>
          <label>Phone Number</label>
          <input type="tel" id="phone" placeholder="01X-XXXXXXX" required />
        </div>

        <div class="full-width">
          <label>Primary Category</label>
          <select id="category">
            <option>Hot Meals</option>
            <option>Bakery & Snacks</option>
            <option>Groceries</option>
            <option>Beverages</option>
          </select>
        </div>

        <div>
          <label>Password</label>
          <input type="password" id="password" placeholder="••••••••" required />
        </div>

        <div>
          <label>Confirm Password</label>
          <input type="password" id="confirmPassword" placeholder="••••••••" required />
        </div>

        <button type="submit" class="btn">Register My Shop</button>

        <div class="footer-note">
          Already registered? <a href="vendorlogin.html" class="link">Log in here</a>
        </div>
      </form>
    </div>
  </div>

  <script>
    document.getElementById('signupForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirmPassword').value;

      if(password !== confirm) {
        alert("Passwords do not match!");
        return;
      }

      localStorage.setItem('vendorUser', JSON.stringify({
        email: email,
        password: password
      }));

      alert("Account created successfully!");
      window.location.href = 'vendorlogin.html';
    });
  </script>
</body>
</html>
