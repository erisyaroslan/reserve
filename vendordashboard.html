<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>ReServe | Vendor Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700&display=swap"
    rel="stylesheet">

  <style>
    :root {
      --primary-green: #2E7D32;
      --accent-green: #66BB6A;
      --light-green: #E8F5E9;
      --text-dark: #2f2f2f;
      --muted: #777;
      --radius: 20px;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
      /* Darker green for buttons and price */
      --darker-green: #1B4332;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      /* ADDED FANCY BACKGROUND */
      background: radial-gradient(circle at 0% 0%, #2D6A4F 0%, transparent 40%),
        radial-gradient(circle at 100% 0%, #52B788 0%, transparent 40%),
        radial-gradient(circle at 50% 50%, #D8E2DC 0%, #B7E4C7 100%);
      background-attachment: fixed;
      color: var(--text-dark);
      min-height: 100vh;
      line-height: 1.6;
    }

    /* HEADER */
    header.dashboard {
      position: fixed;
      top: 0;
      width: 100%;
      height: 80px;
      background: rgba(46, 125, 50, 0.9);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 8%;
      color: white;
      z-index: 1000;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .logo {
      font-family: "Playfair Display", serif;
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(to right, #fff, #C8E6C9);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .nav-links {
      display: flex;
      gap: 24px;
      align-items: center;
    }

    .nav-links a {
      color: rgba(255, 255, 255, 0.8);
      text-decoration: none;
      font-weight: 500;
      font-size: 0.9rem;
      position: relative;
    }

    .nav-links a.active {
      color: white;
      font-weight: 700;
    }

    .nav-links a.active::after {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 0;
      width: 100%;
      height: 2px;
      background: var(--accent-green);
      border-radius: 2px;
    }

    .logout-btn {
      border: 1.5px solid rgba(255, 255, 255, 0.3);
      padding: 8px 20px;
      border-radius: 50px;
      background: rgba(255, 255, 255, 0.1);
      color: white;
      transition: all 0.3s;
    }

    .logout-btn:hover {
      background: white;
      color: var(--primary-green);
    }


    /* MAIN CONTAINER */
    main {
      padding: 110px 8% 50px;
      max-width: 1400px;
      margin: 0 auto;
    }

    .menu-header {
      margin-bottom: 30px;
    }

    .menu-header h2 {
      font-family: 'Playfair Display', serif;
      font-size: 2.2rem;
      margin-bottom: 15px;
      /* Darker green applied to title */
      color: var(--darker-green);
    }

    .post-main-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      /* Darker green applied */
      background: var(--darker-green);
      color: white;
      padding: 14px 28px;
      border-radius: 14px;
      text-decoration: none;
      font-weight: 700;
      font-size: 1rem;
      transition: 0.3s;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      border: none;
      cursor: pointer;
    }

    .post-main-btn:hover {
      background: #0d2119;
      transform: translateY(-2px);
    }

    .welcome-section {
      margin-bottom: 50px;
      animation: fadeInDown 0.8s ease-out;
    }

    .welcome-section h1 {
      font-family: 'Playfair Display', serif;
      font-size: 3.5rem;
      /* Bigger and Bolder */
      font-weight: 900;
      color: var(--darker-green);
      line-height: 1.1;
      margin-bottom: 5px;
      letter-spacing: -1px;
    }

    .welcome-section p {
      font-size: 1.1rem;
      /* Using a very high-contrast deep green so it's readable over the gradient */
      color: #0B291D;
      font-weight: 600;
      margin-left: 4px;
      letter-spacing: 0.5px;
      /* Optional: subtle text-shadow to lift it off the background */
      text-shadow: 0 1px 2px rgba(255, 255, 255, 0.4);
    }

    @keyframes fadeInDown {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* DYNAMIC MENU GRID */
    .menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 30px;
      margin-bottom: 30px;
    }

    .menu-card {
      /* Added glass effect to make cards pop against the new background */
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(5px);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow);
      border: 1px solid rgba(255, 255, 255, 0.4);
      transition: 0.3s;
    }

    .menu-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
    }

    .menu-photo {
      width: 100%;
      height: 200px;
      background-color: #f0f0f0;
      background-size: cover;
      background-position: center;
      position: relative;
    }

    .category-badge {
      position: absolute;
      top: 15px;
      left: 15px;
      background: rgba(255, 255, 255, 0.9);
      padding: 4px 12px;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--primary-green);
    }

    .menu-details {
      padding: 25px;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
    }

    .menu-details h3 {
      font-size: 1.3rem;
      color: var(--text-dark);
      margin-bottom: 8px;
    }

    .menu-desc {
      font-size: 0.9rem;
      color: var(--muted);
      margin-bottom: 20px;
      flex-grow: 1;
    }

    .price-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .price-tag {
      font-weight: 800;
      /* Darker green applied to price */
      color: var(--darker-green);
      font-size: 1.2rem;
    }

    .old-price {
      text-decoration: line-through;
      color: #bbb;
      font-size: 0.9rem;
      margin-right: 8px;
    }

    .stock-tag {
      font-size: 0.8rem;
      font-weight: 600;
      color: #666;
      background: var(--light-green);
      padding: 5px 12px;
      border-radius: 8px;
    }

    .card-actions {
      display: grid;
      /* FIXED: Balanced 1fr 1fr ensures buttons are always identical size */
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding-top: 15px;
      border-top: 1px solid #f5f5f5;
      width: 100%;
    }

    .btn-action {
      width: 100%;
      padding: 12px 5px;
      border-radius: 12px;
      border: none;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: 0.2s;
      text-align: center;
    }

    .edit-btn {
      background: #f0f7f0;
      color: var(--darker-green);
    }

    .edit-btn:hover {
      background: var(--darker-green);
      color: white;
      transform: translateY(-2px);
    }

    .remove-btn {
      background: #fff1f1;
      color: #d32f2f;
    }

    .remove-btn:hover {
      background: #d32f2f;
      color: white;
      transform: translateY(-2px);
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(8px);
      display: none;
      /* Hidden by default */
      justify-content: center;
      align-items: center;
      z-index: 3000;
      animation: fadeIn 0.3s ease;
    }

    /* MODAL CARD */
    .modal-card {
      background: rgba(255, 255, 255, 0.9);
      padding: 40px;
      border-radius: 24px;
      width: 90%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.5);
      transform: scale(0.9);
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    .modal-icon {
      font-size: 3rem;
      margin-bottom: 15px;
    }

    .modal-card h2 {
      font-family: 'Playfair Display', serif;
      color: var(--darker-green);
      font-size: 1.8rem;
      margin-bottom: 10px;
    }

    .modal-card p {
      color: #555;
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 30px;
    }

    /* MODAL BUTTONS */
    .modal-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .modal-btn {
      padding: 14px;
      border-radius: 12px;
      border: none;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-cancel {
      background: #eee;
      color: #666;
    }

    .btn-cancel:hover {
      background: #e5e5e5;
    }

    .btn-confirm {
      background: #D32F2F;
      /* Red for deletion */
      color: white;
    }

    .btn-confirm:hover {
      background: #B71C1C;
      transform: translateY(-2px);
    }

    /* ANIMATIONS */
    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes popIn {
      from {
        transform: scale(0.9);
      }

      to {
        transform: scale(1);
      }
    }

    .fade-out {
      opacity: 0;
      transform: translateY(20px);
      transition: 0.4s ease;
    }
  </style>
</head>

<body>

  <header class="dashboard">
    <div class="logo">ReServe 🌱</div>
    <nav class="nav-links">
      <a href="vendordashboard.html" class="nav-item">Menu Management</a>
      <a href="reservation.html" class="nav-item">Reservations</a>
      <a href="index.html" class="logout-btn">Logout</a>
    </nav>
  </header>

  <main>
    <div class="welcome-section">
      <h1>Welcome, <span id="vendorNameDisplay">Vendor</span></h1>
      <p id="vendorLocationDisplay">Here’s what’s happening with your surplus today.</p>
    </div>

    <div class="menu-header">
      <h2>Your Active Menu</h2>
    </div>

    <div class="menu-grid" id="menuGrid"></div>

    <div class="menu-header">
      <button class="post-main-btn" onclick="window.location.href='add-menu.html'">
        <span>➕</span> Post Surplus Meal
      </button>
    </div>
  </main>

  <div id="deleteModal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-icon">⚠️</div>
      <h2>Remove Item?</h2>
      <p>This will permanently delete this meal from your active menu. This action cannot be undone.</p>
      <div class="modal-actions">
        <button class="modal-btn btn-cancel" id="cancelDelete">No, Keep It</button>
        <button class="modal-btn btn-confirm" id="confirmDelete">Yes, Remove</button>
      </div>
    </div>
  </div>

  <script type="module" src="vendordashboard-logic.js"></script>
</body>

</html>
