<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>ReServe | Vendor Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap"
    rel="stylesheet">

  <style>
    :root {
      --deep-green: #0F3D2E;
      --darker-green: #1B4332;
      --primary-green: #2E7D32;
      --green: #2F8F4E;
      --accent-green: #52B788;
      --soft-green: #74C69D;
      --mint: #B7E4C7;
      --light-green: #EAF6EE;
      --cream: #F6FBF5;
      --text-dark: #16271E;
      --muted: #5C7066;
      --white: #ffffff;
      --radius: 20px;
      --radius-lg: 28px;
      --shadow-sm: 0 8px 24px rgba(6, 28, 20, 0.18);
      --shadow-md: 0 18px 50px rgba(6, 28, 20, 0.28);
      --shadow-lg: 0 30px 70px rgba(6, 28, 20, 0.38);
      --shadow: var(--shadow-sm);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      position: relative;
      min-height: 100vh;
      color: var(--text-dark);
      background-color: #2D6A4F;
      line-height: 1.6;
      overflow-x: hidden;
    }

    /* Mid-green ambient background, same family as index/meals (lighter than before) */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      background:
        radial-gradient(900px 600px at 88% -8%, rgba(116, 198, 157, 0.34), transparent 60%),
        radial-gradient(800px 700px at -10% 12%, rgba(82, 183, 136, 0.32), transparent 55%),
        radial-gradient(1200px 900px at 50% 120%, rgba(27, 67, 50, 0.35), transparent 60%),
        linear-gradient(180deg, #3A8063 0%, #226048 100%);
    }

    /* ===== HEADER (FLOATING GLASS PILL, CONSISTENT WITH INDEX) ===== */
    header.site {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1000;
      transition: all 0.35s ease;
    }

    .nav-inner {
      max-width: 1240px;
      margin: 14px auto 0;
      width: calc(100% - 48px);
      height: 70px;
      padding: 0 14px 0 26px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.7);
      box-shadow: var(--shadow-sm);
      backdrop-filter: blur(18px) saturate(140%);
      -webkit-backdrop-filter: blur(18px) saturate(140%);
      transition: all 0.35s ease;
    }

    header.site.scrolled .nav-inner {
      background: linear-gradient(135deg, rgba(15, 61, 46, 0.92), rgba(27, 67, 50, 0.92));
      border-color: rgba(255, 255, 255, 0.14);
      box-shadow: var(--shadow-md);
      margin-top: 8px;
    }

    .logo {
      font-family: "Playfair Display", serif;
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--deep-green);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo .leaf {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border-radius: 9px;
      background: linear-gradient(135deg, var(--accent-green), var(--primary-green));
      color: #fff;
      font-size: 1rem;
      box-shadow: 0 6px 14px rgba(46, 125, 50, 0.35);
    }

    nav.menu {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    nav.menu a {
      color: var(--darker-green);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.92rem;
      padding: 9px 16px;
      border-radius: 12px;
      transition: all 0.25s ease;
    }

    nav.menu a:hover {
      background: rgba(46, 125, 50, 0.10);
      color: var(--primary-green);
    }

    nav.menu a.active {
      color: var(--primary-green);
      background: rgba(46, 125, 50, 0.12);
    }

    .nav-cta {
      margin-left: 8px;
      background: linear-gradient(135deg, var(--green), var(--darker-green));
      color: #fff !important;
      padding: 11px 22px !important;
      border-radius: 14px;
      box-shadow: 0 10px 22px rgba(27, 67, 50, 0.25);
    }

    .nav-cta:hover {
      transform: translateY(-2px);
    }

    header.site.scrolled .logo {
      color: #fff;
    }

    header.site.scrolled nav.menu a {
      color: rgba(255, 255, 255, 0.88);
    }

    header.site.scrolled nav.menu a:hover,
    header.site.scrolled nav.menu a.active {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
    }

    header.site.scrolled .nav-cta {
      background: linear-gradient(135deg, var(--accent-green), var(--soft-green)) !important;
      color: var(--deep-green) !important;
    }


    /* MAIN CONTAINER */
    main {
      padding: 150px 8% 60px;
      max-width: 1400px;
      margin: 0 auto;
    }

    .menu-header {
      margin-bottom: 30px;
    }

    .menu-header h2 {
      font-family: 'Playfair Display', serif;
      font-size: 2.2rem;
      margin-bottom: 15px;
      color: #fff;
    }

    .post-main-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, var(--green), var(--darker-green));
      color: white;
      padding: 16px 32px;
      border-radius: 16px;
      text-decoration: none;
      font-weight: 700;
      font-size: 1rem;
      transition: 0.3s;
      box-shadow: 0 14px 30px rgba(46, 125, 50, 0.28);
      border: none;
      cursor: pointer;
    }

    .post-main-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 20px 40px rgba(46, 125, 50, 0.36);
    }

    .welcome-section {
      margin-bottom: 50px;
      animation: fadeInDown 0.8s ease-out;
    }

    .welcome-section h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.4rem, 5vw, 3.5rem);
      font-weight: 800;
      color: #fff;
      line-height: 1.1;
      margin-bottom: 8px;
      letter-spacing: -1px;
    }

    .welcome-section h1 span {
      background: linear-gradient(120deg, var(--accent-green), var(--mint));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .welcome-section p {
      font-size: 1.1rem;
      color: var(--mint);
      font-weight: 500;
      margin-left: 4px;
      letter-spacing: 0.3px;
    }

    @keyframes fadeInDown {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* DYNAMIC MENU GRID */
    .menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 30px;
      margin-bottom: 30px;
    }

    .menu-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: var(--radius-lg);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-sm);
      border: 1px solid rgba(255, 255, 255, 0.6);
      position: relative;
      transition: all 0.4s ease;
    }

    .menu-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      height: 4px;
      width: 100%;
      z-index: 5;
      background: linear-gradient(90deg, var(--accent-green), var(--primary-green));
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.4s ease;
    }

    .menu-card:hover {
      transform: translateY(-10px);
      box-shadow: var(--shadow-lg);
    }

    .menu-card:hover::before {
      transform: scaleX(1);
    }

    .menu-photo {
      width: 100%;
      height: 200px;
      background-color: #f0f0f0;
      background-size: cover;
      background-position: center;
      position: relative;
    }

    .category-badge {
      position: absolute;
      top: 15px;
      left: 15px;
      background: rgba(255, 255, 255, 0.9);
      padding: 4px 12px;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--primary-green);
    }

    .menu-details {
      padding: 25px;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
    }

    .menu-details h3 {
      font-family: 'Playfair Display', serif;
      font-size: 1.3rem;
      color: var(--deep-green);
      margin-bottom: 8px;
    }

    .menu-desc {
      font-size: 0.9rem;
      color: var(--muted);
      margin-bottom: 20px;
      flex-grow: 1;
    }

    .price-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .price-tag {
      font-weight: 800;
      /* Darker green applied to price */
      color: var(--darker-green);
      font-size: 1.2rem;
    }

    .old-price {
      text-decoration: line-through;
      color: #bbb;
      font-size: 0.9rem;
      margin-right: 8px;
    }

    .stock-tag {
      font-size: 0.8rem;
      font-weight: 600;
      color: #666;
      background: var(--light-green);
      padding: 5px 12px;
      border-radius: 8px;
    }

    .card-actions {
      display: grid;
      /* FIXED: Balanced 1fr 1fr ensures buttons are always identical size */
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding-top: 15px;
      border-top: 1px solid #f5f5f5;
      width: 100%;
    }

    .btn-action {
      width: 100%;
      padding: 12px 5px;
      border-radius: 12px;
      border: none;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: 0.2s;
      text-align: center;
    }

    .edit-btn {
      background: var(--light-green);
      color: var(--darker-green);
    }

    .edit-btn:hover {
      background: var(--darker-green);
      color: white;
      transform: translateY(-2px);
    }

    .remove-btn {
      background: #fff1f1;
      color: #d32f2f;
    }

    .remove-btn:hover {
      background: #d32f2f;
      color: white;
      transform: translateY(-2px);
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(8px);
      display: none;
      /* Hidden by default */
      justify-content: center;
      align-items: center;
      z-index: 3000;
      animation: fadeIn 0.3s ease;
    }

    /* MODAL CARD */
    .modal-card {
      background: rgba(255, 255, 255, 0.9);
      padding: 40px;
      border-radius: 24px;
      width: 90%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.5);
      transform: scale(0.9);
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    .modal-icon {
      font-size: 3rem;
      margin-bottom: 15px;
    }

    .modal-card h2 {
      font-family: 'Playfair Display', serif;
      color: var(--darker-green);
      font-size: 1.8rem;
      margin-bottom: 10px;
    }

    .modal-card p {
      color: #555;
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 30px;
    }

    /* MODAL BUTTONS */
    .modal-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .modal-btn {
      padding: 14px;
      border-radius: 12px;
      border: none;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-cancel {
      background: #eee;
      color: #666;
    }

    .btn-cancel:hover {
      background: #e5e5e5;
    }

    .btn-confirm {
      background: #D32F2F;
      /* Red for deletion */
      color: white;
    }

    .btn-confirm:hover {
      background: #B71C1C;
      transform: translateY(-2px);
    }

    /* ANIMATIONS */
    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes popIn {
      from {
        transform: scale(0.9);
      }

      to {
        transform: scale(1);
      }
    }

    .fade-out {
      opacity: 0;
      transform: translateY(20px);
      transition: 0.4s ease;
    }
  </style>
</head>

<body>

  <header class="site" id="siteHeader">
    <div class="nav-inner">
      <div class="logo" onclick="location.href='index.html'">
        <span class="leaf">🌱</span> ReServe
      </div>
      <nav class="menu">
        <a href="vendordashboard.html" class="active">Menu Management</a>
        <a href="reservation.html">Reservations</a>
        <a href="vendorprofile.html">Profile</a>
        <a href="index.html" class="nav-cta">Logout</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="welcome-section">
      <h1>Welcome, <span id="vendorNameDisplay">Vendor</span></h1>
      <p id="vendorLocationDisplay">Here’s what’s happening with your surplus today.</p>
    </div>

    <div class="menu-header">
      <h2>Your Active Menu</h2>
    </div>

    <div class="menu-grid" id="menuGrid"></div>

    <div class="menu-header">
      <button class="post-main-btn" onclick="window.location.href='add-menu.html'">
        <span>➕</span> Post Surplus Meal
      </button>
    </div>
  </main>

  <div id="deleteModal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-icon">⚠️</div>
      <h2>Remove Item?</h2>
      <p>This will permanently delete this meal from your active menu. This action cannot be undone.</p>
      <div class="modal-actions">
        <button class="modal-btn btn-cancel" id="cancelDelete">No, Keep It</button>
        <button class="modal-btn btn-confirm" id="confirmDelete">Yes, Remove</button>
      </div>
    </div>
  </div>

  <script>
    // Glass nav: darken on scroll (consistent with index.html / meals.html)
    const siteHeader = document.getElementById('siteHeader');
    window.addEventListener('scroll', () => {
      siteHeader.classList.toggle('scrolled', window.scrollY > 10);
    }, { passive: true });
  </script>
  <script type="module" src="vendordashboard-logic.js"></script>
</body>

</html>
