<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>ReServe | Edit Meal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700;900&display=swap"
        rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        :root {
            --primary-green: #2E7D32;
            --accent-green: #66BB6A;
            --darker-green: #1B4332;
            --soft-bg: #F5FBF6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: radial-gradient(circle at 0% 0%, #2D6A4F 0%, transparent 40%),
                radial-gradient(circle at 100% 0%, #52B788 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, #D8E2DC 0%, #B7E4C7 100%);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header.dashboard {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 75px;
            background: linear-gradient(135deg, var(--primary-green), var(--accent-green));
            display: flex;
            align-items: center;
            padding: 0 5%;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            z-index: 2000;
        }

        .back-link {
            text-decoration: none;
            color: white;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.85rem;
            letter-spacing: 1px;
        }

        .edit-wrapper {
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            max-width: 1300px;
            margin: 0 auto;
            gap: 40px;
            padding: 120px 40px 60px;
            min-height: 100vh;
        }

        .preview-pane {
            position: sticky;
            top: 110px;
            height: fit-content;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            text-align: center;
        }

        .preview-pane h3 {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            color: var(--darker-green);
            margin-bottom: 25px;
        }

        .meal-card-mockup {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            text-align: left;
        }

        .mock-img {
            width: 100%;
            height: 200px;
            background: url('image/nasilemak.jpg') center/cover;
        }

        .mock-details {
            padding: 20px;
        }

        .form-pane {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            padding: 60px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.1);
            position: relative;
        }

        .form-pane h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.8rem;
            color: var(--darker-green);
            margin-bottom: 10px;
        }

        .sub-title {
            font-size: 1rem;
            color: var(--darker-green);
            font-weight: 600;
            opacity: 0.7;
            margin-bottom: 40px;
        }

        .input-section {
            border-top: 1px solid rgba(0, 0, 0, 0.06);
            padding-top: 25px;
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-size: 0.75rem;
            font-weight: 800;
            color: var(--darker-green);
            text-transform: uppercase;
            margin-bottom: 12px;
            opacity: 0.7;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            border: 1.5px solid #E0E0E0;
            background: white;
            font-size: 1rem;
            transition: 0.3s;
        }

        input:focus {
            border-color: var(--primary-green);
            outline: none;
            box-shadow: 0 0 0 4px rgba(46, 125, 50, 0.1);
        }

        .price-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .action-btns {
            display: flex;
            gap: 15px;
            margin-top: 40px;
        }

        .btn-save {
            flex: 2;
            background: var(--darker-green);
            color: white;
            padding: 18px;
            border-radius: 15px;
            border: none;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-save:hover {
            background: #000;
            transform: translateY(-3px);
        }

        .btn-discard {
            flex: 1;
            background: #F1F1F1;
            color: #666;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
        }

        /* CUSTOM SWEETALERT STYLES (MATCHING YOUR ADD PAGE) */
        .premium-popup {
            border-radius: 30px !important;
        }

        .premium-confirm-btn {
            background: #2E7D32 !important;
            color: white !important;
            border-radius: 50px !important;
            padding: 12px 30px !important;
            font-weight: 600 !important;
            cursor: pointer;
            border: none !important;
        }
    </style>
</head>

<body>

    <header class="dashboard">
        <a href="vendordashboard.html" class="back-link">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            BACK TO DASHBOARD
        </a>
    </header>

    <div class="edit-wrapper">
        <aside class="preview-pane">
            <h3>Live Preview</h3>
            <div class="meal-card-mockup">
                <div class="mock-img" id="prevImg"></div>
                <div class="mock-details">
                    <p id="prevCat"
                        style="font-size: 0.7rem; font-weight: 800; color: var(--primary-green); margin-bottom: 5px; text-transform: uppercase;">
                        HOT MEAL</p>
                    <h4 id="prevName" style="font-size: 1.2rem; color: #333; margin-bottom: 10px;">Meal Name</h4>
                    <p id="prevDesc" style="font-size: 0.85rem; color: #777; margin-bottom: 15px;">Description
                        preview...</p>
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <span id="prevNew" style="font-weight: 800; color: var(--darker-green);">RM 0.00</span>
                        <span id="prevQty"
                            style="font-size: 0.75rem; background: #E8F5E9; padding: 4px 8px; border-radius: 5px; color: var(--primary-green);">0
                            Left</span>
                    </div>
                </div>
            </div>
            <p
                style="margin-top: 30px; font-size: 0.85rem; color: var(--darker-green); opacity: 0.6; font-style: italic;">
                "This is how students will see your meal in the listing."
            </p>
        </aside>

        <main class="form-pane">
            <h1>Edit Your Meal's Details</h1>
            <p class="sub-title">Update your meal information and pricing.</p>

            <form id="editMealForm">
                <div class="input-section">
                    <label>Update Photo</label>
                    <input type="file" id="mealImageInput" accept="image/*" onchange="updatePreviewImage(this)"
                        style="border: none; padding-left: 0;">
                </div>

                <div class="input-section">
                    <label>Meal Name</label>
                    <input type="text" id="mealName" oninput="updatePreview()" required>
                </div>

                <div class="input-section">
                    <label>Category</label>
                    <select id="category" onchange="updatePreview()">
                        <option value="Hot Meal">Hot Meal</option>
                        <option value="Snacks">Snacks</option>
                        <option value="Western">Western</option>
                    </select>
                </div>

                <div class="input-section">
                    <label>Description</label>
                    <textarea id="description" rows="3" oninput="updatePreview()"></textarea>
                </div>

                <div class="price-grid input-section">
                    <div>
                        <label>Original Price (RM)</label>
                        <input type="number" id="oldPrice" step="0.01" oninput="updatePreview()">
                    </div>
                    <div>
                        <label>Surplus Price (RM)</label>
                        <input type="number" id="newPrice" step="0.01" oninput="updatePreview()"
                            style="color: var(--primary-green); font-weight: 800;">
                    </div>
                </div>

                <div class="input-section">
                    <label>Available Quantity</label>
                    <input type="number" id="qty" oninput="updatePreview()">
                </div>

                <div class="action-btns">
                    <button type="button" id="saveMealBtn" class="btn-save">Update Meal Details</button>
                    <a href="vendordashboard.html" class="btn-discard">Discard</a>
                </div>
            </form>
        </main>
    </div>

    <script>
        // Live Preview Logic
        function updatePreview() {
            document.getElementById('prevName').innerText = document.getElementById('mealName').value || "Meal Name";
            document.getElementById('prevCat').innerText = document.getElementById('category').value;
            document.getElementById('prevDesc').innerText = document.getElementById('description').value || "Description...";
            document.getElementById('prevNew').innerText = "RM " + parseFloat(document.getElementById('newPrice').value || 0).toFixed(2);
            document.getElementById('prevQty').innerText = (document.getElementById('qty').value || 0) + " Left";
        }

        function updatePreviewImage(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    document.getElementById('prevImg').style.backgroundImage = `url(${e.target.result})`;
                };
                reader.readAsDataURL(input.files[0]);
            }
        }
    </script>

    <script type="module" src="firebase-config.js"></script>
    <script type="module" src="editmeals-logic.js"></script>

</body>

</html>
