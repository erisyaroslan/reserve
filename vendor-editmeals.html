<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>ReServe | Edit Meal</title>
    <link rel="icon" type="image/png" href="image/favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700;900&display=swap"
        rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        :root {
            --deep-green: #0F3D2E;
            --darker-green: #1B4332;
            --primary-green: #2E7D32;
            --green: #2F8F4E;
            --accent-green: #52B788;
            --soft-green: #74C69D;
            --mint: #B7E4C7;
            --light-green: #EAF6EE;
            --cream: #F6FBF5;
            --text-dark: #16271E;
            --muted: #5C7066;
            --white: #ffffff;
            --glass: rgba(255, 255, 255, 0.78);
            --radius-lg: 28px;
            --shadow-sm: 0 8px 24px rgba(15, 61, 46, 0.06);
            --shadow-md: 0 18px 50px rgba(15, 61, 46, 0.10);
            --shadow-lg: 0 30px 70px rgba(15, 61, 46, 0.16);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--deep-green);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -1;
            background:
                radial-gradient(900px 600px at 88% -8%, rgba(82, 183, 136, 0.28), transparent 60%),
                radial-gradient(800px 700px at -10% 12%, rgba(46, 143, 78, 0.30), transparent 55%),
                radial-gradient(1200px 900px at 50% 120%, rgba(11, 41, 29, 0.55), transparent 60%),
                linear-gradient(180deg, var(--cream) 0%, var(--light-green) 100%);
        }

        /* HEADER (Glass pill style - no scroll behavior) */
        header.site {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 2000;
        }

        .nav-inner {
            max-width: 1240px;
            margin: 14px auto 0;
            width: calc(100% - 48px);
            height: 70px;
            padding: 0 14px 0 26px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-radius: 22px;
            background: linear-gradient(135deg, rgba(15, 61, 46, 0.92), rgba(27, 67, 50, 0.92));
            border: 1px solid rgba(255, 255, 255, 0.14);
            backdrop-filter: blur(18px) saturate(140%);
            -webkit-backdrop-filter: blur(18px) saturate(140%);
            box-shadow: var(--shadow-md);
        }

        .logo {
            font-family: "Playfair Display", serif;
            font-size: 1.6rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }

        .logo .leaf {
            width: 30px;
            height: 30px;
            display: grid;
            place-items: center;
            border-radius: 9px;
            background: linear-gradient(135deg, var(--accent-green), var(--primary-green));
            color: #fff;
            font-size: 1rem;
            box-shadow: 0 6px 14px rgba(46, 125, 50, 0.35);
        }

        nav.menu {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        nav.menu a {
            color: rgba(255, 255, 255, 0.88);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.92rem;
            padding: 9px 16px;
            border-radius: 12px;
            transition: all 0.25s ease;
        }

        nav.menu a:hover {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
        }

        .edit-wrapper {
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            max-width: 1300px;
            margin: 0 auto;
            gap: 40px;
            padding: 140px 40px 60px;
            min-height: 100vh;
        }

        .preview-pane {
            position: sticky;
            top: 130px;
            height: fit-content;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: var(--radius-lg);
            border: 1px solid rgba(255, 255, 255, 0.6);
            text-align: center;
            box-shadow: var(--shadow-sm);
        }

        .preview-pane h3 {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            color: var(--darker-green);
            margin-bottom: 25px;
        }

        .meal-card-mockup {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            text-align: left;
        }

        .mock-img {
            width: 100%;
            height: 200px;
            background: url('image/nasilemak.jpg') center/cover;
        }

        .mock-details {
            padding: 20px;
        }

        .form-pane {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 60px;
            border-radius: var(--radius-lg);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: var(--shadow-sm);
            position: relative;
        }

        .form-pane h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.8rem;
            color: var(--darker-green);
            margin-bottom: 10px;
        }

        .sub-title {
            font-size: 1rem;
            color: var(--darker-green);
            font-weight: 600;
            opacity: 0.7;
            margin-bottom: 40px;
        }

        .input-section {
            border-top: 1px solid rgba(0, 0, 0, 0.06);
            padding-top: 25px;
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-size: 0.75rem;
            font-weight: 800;
            color: var(--darker-green);
            text-transform: uppercase;
            margin-bottom: 12px;
            opacity: 0.7;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            border: 1.5px solid #E0E0E0;
            background: white;
            font-size: 1rem;
            transition: 0.3s;
        }

        input:focus {
            border-color: var(--primary-green);
            outline: none;
            box-shadow: 0 0 0 4px rgba(46, 125, 50, 0.1);
        }

        .price-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .action-btns {
            display: flex;
            gap: 15px;
            margin-top: 40px;
        }

        .btn-save {
            flex: 2;
            background: var(--darker-green);
            color: white;
            padding: 18px;
            border-radius: 15px;
            border: none;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-save:hover {
            background: #000;
            transform: translateY(-3px);
        }

        .btn-discard {
            flex: 1;
            background: #F1F1F1;
            color: #666;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
        }

        /* CUSTOM SWEETALERT STYLES (MATCHING YOUR ADD PAGE) */
        .premium-popup {
            border-radius: 30px !important;
        }

        .premium-confirm-btn {
            background: #2E7D32 !important;
            color: white !important;
            border-radius: 50px !important;
            padding: 12px 30px !important;
            font-weight: 600 !important;
            cursor: pointer;
            border: none !important;
        }
    </style>
</head>

<body>

    <header class="site">
        <div class="nav-inner">
            <a href="vendordashboard.html" class="logo">
                <span class="leaf">🌱</span> ReServe
            </a>
            <nav class="menu">
                <a href="vendordashboard.html">Back to Dashboard</a>
            </nav>
        </div>
    </header>

    <div class="edit-wrapper">
        <aside class="preview-pane">
            <h3>Live Preview</h3>
            <div class="meal-card-mockup">
                <div class="mock-img" id="prevImg"></div>
                <div class="mock-details">
                    <p id="prevCat"
                        style="font-size: 0.7rem; font-weight: 800; color: var(--primary-green); margin-bottom: 5px; text-transform: uppercase;">
                        HOT MEAL</p>
                    <h4 id="prevName" style="font-size: 1.2rem; color: #333; margin-bottom: 10px;">Meal Name</h4>
                    <p id="prevDesc" style="font-size: 0.85rem; color: #777; margin-bottom: 15px;">Description
                        preview...</p>
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <span id="prevNew" style="font-weight: 800; color: var(--darker-green);">RM 0.00</span>
                        <span id="prevQty"
                            style="font-size: 0.75rem; background: #E8F5E9; padding: 4px 8px; border-radius: 5px; color: var(--primary-green);">0
                            Left</span>
                    </div>
                </div>
            </div>
            <p
                style="margin-top: 30px; font-size: 0.85rem; color: var(--darker-green); opacity: 0.6; font-style: italic;">
                "This is how students will see your meal in the listing."
            </p>
        </aside>

        <main class="form-pane">
            <h1>Edit Your Meal's Details</h1>
            <p class="sub-title">Update your meal information and pricing.</p>

            <form id="editMealForm">
                <div class="input-section">
                    <label>Update Photo</label>
                    <input type="file" id="mealImageInput" accept="image/*" onchange="updatePreviewImage(this)"
                        style="border: none; padding-left: 0;">
                </div>

                <div class="input-section">
                    <label>Meal Name</label>
                    <input type="text" id="mealName" oninput="updatePreview()" required>
                </div>

                <div class="input-section">
                    <label>Category</label>
                    <select id="category" onchange="updatePreview()">
                        <option value="Hot Meal">Hot Meal</option>
                        <option value="Snacks">Snacks</option>
                        <option value="Western">Western</option>
                    </select>
                </div>

                <div class="input-section">
                    <label>Description</label>
                    <textarea id="description" rows="3" oninput="updatePreview()"></textarea>
                </div>

                <div class="price-grid input-section">
                    <div>
                        <label>Original Price (RM)</label>
                        <input type="number" id="oldPrice" step="0.01" oninput="updatePreview()">
                    </div>
                    <div>
                        <label>Surplus Price (RM)</label>
                        <input type="number" id="newPrice" step="0.01" oninput="updatePreview()"
                            style="color: var(--primary-green); font-weight: 800;">
                    </div>
                </div>

                <div class="input-section">
                    <label>Available Quantity</label>
                    <input type="number" id="qty" oninput="updatePreview()">
                </div>

                <div class="action-btns">
                    <button type="button" id="saveMealBtn" class="btn-save">Update Meal Details</button>
                    <a href="vendordashboard.html" class="btn-discard">Discard</a>
                </div>
            </form>
        </main>
    </div>

    <script>
        // Live Preview Logic
        function updatePreview() {
            document.getElementById('prevName').innerText = document.getElementById('mealName').value || "Meal Name";
            document.getElementById('prevCat').innerText = document.getElementById('category').value;
            document.getElementById('prevDesc').innerText = document.getElementById('description').value || "Description...";
            document.getElementById('prevNew').innerText = "RM " + parseFloat(document.getElementById('newPrice').value || 0).toFixed(2);
            document.getElementById('prevQty').innerText = (document.getElementById('qty').value || 0) + " Left";
        }

        function updatePreviewImage(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    document.getElementById('prevImg').style.backgroundImage = `url(${e.target.result})`;
                };
                reader.readAsDataURL(input.files[0]);
            }
        }
    </script>

    <script type="module" src="firebase-config.js"></script>
    <script type="module" src="editmeals-logic.js"></script>

</body>

</html>
