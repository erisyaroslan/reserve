<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>ReServe | Vendor Login</title>
  <link rel="icon" type="image/png" href="image/favicon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700&display=swap"
    rel="stylesheet">

  <style>
    :root {
      --deep-green: #0F3D2E;
      --darker-green: #1B4332;
      --primary-green: #2E7D32;
      --green: #2F8F4E;
      --accent-green: #52B788;
      --soft-green: #74C69D;
      --mint: #B7E4C7;
      --light-green: #EAF6EE;
      --cream: #F6FBF5;
      --text-dark: #16271E;
      --muted: #5C7066;
      --white: #ffffff;
      --deep-sage: #0F3D2E;
      --glass: rgba(255, 255, 255, 0.78);
      --radius-lg: 28px;
      --shadow-sm: 0 8px 24px rgba(15, 61, 46, 0.06);
      --shadow-md: 0 18px 50px rgba(15, 61, 46, 0.10);
      --shadow-lg: 0 30px 70px rgba(15, 61, 46, 0.16);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background-color: var(--deep-green);
      padding-bottom: 80px;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      background:
        radial-gradient(900px 600px at 88% -8%, rgba(82, 183, 136, 0.28), transparent 60%),
        radial-gradient(800px 700px at -10% 12%, rgba(46, 143, 78, 0.30), transparent 55%),
        radial-gradient(1200px 900px at 50% 120%, rgba(11, 41, 29, 0.55), transparent 60%),
        linear-gradient(180deg, var(--cream) 0%, var(--light-green) 100%);
    }

    /* HEADER (Glass pill style) */
    header.site {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1000;
      transition: all 0.35s ease;
    }

    .nav-inner {
      max-width: 1240px;
      margin: 14px auto 0;
      width: calc(100% - 48px);
      height: 70px;
      padding: 0 14px 0 26px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(18px) saturate(140%);
      -webkit-backdrop-filter: blur(18px) saturate(140%);
      box-shadow: var(--shadow-sm);
      transition: all 0.35s ease;
    }

    header.site.scrolled .nav-inner {
      background: linear-gradient(135deg, rgba(15, 61, 46, 0.92), rgba(27, 67, 50, 0.92));
      border-color: rgba(255, 255, 255, 0.14);
      box-shadow: var(--shadow-md);
      margin-top: 8px;
    }

    .logo {
      font-family: "Playfair Display", serif;
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--deep-green);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
    }

    .logo .leaf {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border-radius: 9px;
      background: linear-gradient(135deg, var(--accent-green), var(--primary-green));
      color: #fff;
      font-size: 1rem;
      box-shadow: 0 6px 14px rgba(46, 125, 50, 0.35);
    }

    nav.menu {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    nav.menu a {
      color: var(--darker-green);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.92rem;
      padding: 9px 16px;
      border-radius: 12px;
      transition: all 0.25s ease;
    }

    nav.menu a:hover {
      background: rgba(46, 125, 50, 0.10);
      color: var(--primary-green);
    }

    nav.menu a.active {
      color: var(--primary-green);
      background: rgba(46, 125, 50, 0.12);
    }

    .nav-cta {
      margin-left: 8px;
      background: linear-gradient(135deg, var(--green), var(--darker-green));
      color: #fff !important;
      padding: 11px 22px !important;
      border-radius: 14px;
      box-shadow: 0 10px 22px rgba(27, 67, 50, 0.25);
    }

    .nav-cta:hover {
      transform: translateY(-2px);
    }

    header.site.scrolled .logo {
      color: #fff;
    }

    header.site.scrolled nav.menu a {
      color: rgba(255, 255, 255, 0.88);
    }

    header.site.scrolled nav.menu a:hover,
    header.site.scrolled nav.menu a.active {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
    }

    header.site.scrolled .nav-cta {
      background: linear-gradient(135deg, var(--accent-green), var(--soft-green)) !important;
      color: var(--deep-green) !important;
    }

    main {
      padding: 150px 8% 40px;
      max-width: 1400px;
      margin: auto;
      animation: fadeIn 0.8s ease-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* PROFILE CARD ENHANCEMENT */
    .profile-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      padding: 40px;
      max-width: 600px;
      margin: auto;
      border: 1px solid rgba(255, 255, 255, 0.6);
    }

    .photo-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      margin-bottom: 40px;
    }

    .profile-photo {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: #f0f0f0;
      background-size: cover;
      background-position: center;
      border: 4px solid var(--light-green);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
    }

    .photo-btn {
      font-size: 0.85rem;
      padding: 8px 20px;
      background: var(--light-green);
      color: var(--primary-green);
      border: 1px solid rgba(46, 125, 50, 0.1);
      border-radius: 50px;
      cursor: pointer;
      font-weight: 700;
      transition: all 0.3s ease;
    }

    .photo-btn:hover {
      background: var(--primary-green);
      color: white;
    }

    .profile-name {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      padding-bottom: 20px;
      border-bottom: 1px solid #f0f8f1;
    }

    .profile-name span {
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--darker-green);
      letter-spacing: -0.5px;
    }

    .profile-info {
      display: grid;
      grid-template-columns: 1fr auto;
      row-gap: 25px;
      column-gap: 20px;
      align-items: center;
      margin-bottom: 40px;
    }

    .profile-info span {
      font-size: 1rem;
      color: var(--text-dark);
      font-weight: 500;
    }

    .btn-edit {
      background: transparent;
      color: var(--primary-green);
      border: 1.5px solid var(--primary-green);
      padding: 6px 16px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.85rem;
      transition: all 0.2s;
    }

    .btn-edit:hover {
      background: var(--primary-green);
      color: white;
    }

    .btn-logout {
      width: 100%;
      padding: 16px;
      border-radius: 18px;
      border: none;
      background: linear-gradient(135deg, var(--primary-green), var(--darker-green));
      color: white;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(46, 125, 50, 0.2);
      transition: all 0.3s ease;
    }

    .btn-logout:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 30px rgba(46, 125, 50, 0.3);
      filter: brightness(1.1);
    }
  </style>
</head>

<body>

  <header class="site" id="siteHeader">
    <div class="nav-inner">
      <a href="vendordashboard.html" class="logo">
        <span class="leaf">🌱</span> ReServe
      </a>
      <nav class="menu">
        <a href="vendordashboard.html">Menu Management</a>
        <a href="reservation.html">Reservations</a>
        <a href="vendorprofile.html" class="active">Profile</a>
        <a href="index.html" class="nav-cta">Logout</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="profile-card">
      <!-- Photo Section -->
      <div class="photo-section">
        <div class="profile-photo" id="profilePhoto"></div>
        <button class="photo-btn" onclick="uploadPhoto()">Change Photo</button>
        <input type="file" id="photoInput" accept="image/*" hidden>
      </div>

      <!-- Shop Name -->
      <div class="profile-name">
        <span id="shopNameText">Loading...</span>
        <button class="btn-edit" onclick="toggleEdit('shopName', this)">Edit</button>
      </div>

      <!-- Other Info -->
      <div class="profile-info">
        <span id="emailText">Email: Loading...</span>
        <button class="btn-edit" onclick="toggleEdit('email', this)">Edit</button>

        <span id="locationText">Location: Loading...</span>
        <button class="btn-edit" onclick="toggleEdit('location', this)">Edit</button>
      </div>

      <!-- Logout Button -->
      <button class="btn-logout" onclick="logout()">Logout</button>
    </div>
  </main>

  <!-- Firebase Scripts -->
  <script type="module" src="firebase-config.js"></script>
  <script type="module" src="vendorprofile.js"></script>

  <script>
    // Glass nav: darken on scroll (consistent with index.html / meals.html)
    const siteHeader = document.getElementById('siteHeader');
    window.addEventListener('scroll', () => {
      siteHeader.classList.toggle('scrolled', window.scrollY > 10);
    }, { passive: true });
  </script>

</body>

</html>
