<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>ReServe | User Dashboard</title>
  <link rel="icon" type="image/png" href="image/favicon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700&display=swap"
    rel="stylesheet">

  <style>
    :root {
      --deep-green: #0F3D2E;
      --darker-green: #1B4332;
      --primary-green: #2E7D32;
      --green: #2F8F4E;
      --accent-green: #52B788;
      --soft-green: #74C69D;
      --mint: #B7E4C7;
      --light-green: #EAF6EE;
      --cream: #F6FBF5;
      --text-dark: #16271E;
      --muted: #5C7066;
      --white: #ffffff;
      --deep-sage: #0F3D2E;
      --glass: rgba(255, 255, 255, 0.78);
      --radius-lg: 28px;
      --shadow-sm: 0 8px 24px rgba(15, 61, 46, 0.06);
      --shadow-md: 0 18px 50px rgba(15, 61, 46, 0.10);
      --shadow-lg: 0 30px 70px rgba(15, 61, 46, 0.16);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background-color: var(--deep-green);
      background-attachment: fixed;
      min-height: 100vh;
      color: var(--text-dark);
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      background:
        radial-gradient(900px 600px at 88% -8%, rgba(82, 183, 136, 0.28), transparent 60%),
        radial-gradient(800px 700px at -10% 12%, rgba(46, 143, 78, 0.30), transparent 55%),
        radial-gradient(1200px 900px at 50% 120%, rgba(11, 41, 29, 0.55), transparent 60%),
        linear-gradient(180deg, var(--cream) 0%, var(--light-green) 100%);
    }

    /* HEADER (Glass pill style) */
    header.site {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1000;
      transition: all 0.35s ease;
    }

    .nav-inner {
      max-width: 1240px;
      margin: 14px auto 0;
      width: calc(100% - 48px);
      height: 70px;
      padding: 0 14px 0 26px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(18px) saturate(140%);
      -webkit-backdrop-filter: blur(18px) saturate(140%);
      box-shadow: var(--shadow-sm);
      transition: all 0.35s ease;
    }

    header.site.scrolled .nav-inner {
      background: linear-gradient(135deg, rgba(15, 61, 46, 0.92), rgba(27, 67, 50, 0.92));
      border-color: rgba(255, 255, 255, 0.14);
      box-shadow: var(--shadow-md);
      margin-top: 8px;
    }

    .logo {
      font-family: "Playfair Display", serif;
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--deep-green);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
    }

    .logo .leaf {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent-green), var(--primary-green));
      color: #fff;
      font-size: 1.1rem;
      font-weight: 800;
      font-family: "Playfair Display", serif;
      box-shadow: 0 6px 14px rgba(46, 125, 50, 0.35);
    }

    nav.menu {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    nav.menu a {
      color: var(--darker-green);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.92rem;
      padding: 9px 16px;
      border-radius: 12px;
      transition: all 0.25s ease;
    }

    nav.menu a:hover {
      background: rgba(46, 125, 50, 0.10);
      color: var(--primary-green);
    }

    nav.menu a.active {
      color: var(--primary-green);
      background: rgba(46, 125, 50, 0.12);
    }

    .nav-cta {
      margin-left: 8px;
      background: linear-gradient(135deg, var(--green), var(--darker-green));
      color: #fff !important;
      padding: 11px 22px !important;
      border-radius: 14px;
      box-shadow: 0 10px 22px rgba(27, 67, 50, 0.25);
    }

    .nav-cta:hover {
      transform: translateY(-2px);
    }

    header.site.scrolled .logo {
      color: #fff;
    }

    header.site.scrolled nav.menu a {
      color: rgba(255, 255, 255, 0.88);
    }

    header.site.scrolled nav.menu a:hover,
    header.site.scrolled nav.menu a.active {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
    }

    header.site.scrolled .nav-cta {
      background: linear-gradient(135deg, var(--accent-green), var(--soft-green)) !important;
      color: var(--deep-green) !important;
    }

    /* MAIN CONTENT */
    main {
      padding: 150px 8% 50px;
      max-width: 1200px;
      margin: auto;
      animation: fadeIn 0.8s ease-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .welcome-section {
      margin-bottom: 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 20px;
    }

    .welcome-text {
      flex: 1;
      min-width: 300px;
    }

    .welcome-section h1 {
      font-family: "Playfair Display", serif;
      font-size: 3rem;
      color: var(--darker-green);
      margin-bottom: 10px;
    }

    .welcome-section p {
      font-weight: 500;
      color: var(--muted);
      font-size: 1.1rem;
    }

    .welcome-badges {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .badge {
      background: linear-gradient(135deg, var(--accent-green), var(--soft-green));
      color: var(--deep-green);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 12px rgba(82, 183, 136, 0.25);
    }

    /* STATS CARDS */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 25px;
      margin-bottom: 60px;
    }

    .stat-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: var(--radius-lg);
      padding: 30px;
      box-shadow: var(--shadow-sm);
      border: 1px solid rgba(255, 255, 255, 0.6);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .stat-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
    }

    .stat-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 6px;
      height: 100%;
      background: var(--primary-green);
    }

    .stat-icon {
      width: 50px;
      height: 50px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--light-green), var(--mint));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      margin-bottom: 15px;
    }

    .stat-card h3 {
      font-size: 0.9rem;
      color: var(--muted);
      margin-bottom: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .stat-card span {
      font-size: 2.4rem;
      font-weight: 800;
      color: var(--darker-green);
      display: block;
      letter-spacing: -1px;
      line-height: 1;
    }

    .stat-trend {
      font-size: 0.8rem;
      color: var(--primary-green);
      font-weight: 600;
      margin-top: 8px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* ORDER HISTORY SECTION */
    .section-title {
      font-family: "Playfair Display", serif;
      font-size: 2.2rem;
      color: var(--darker-green);
      margin-bottom: 30px;
    }

    .order-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: var(--radius-lg);
      padding: 25px;
      box-shadow: var(--shadow-sm);
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border: 1px solid rgba(255, 255, 255, 0.6);
      transition: all 0.3s ease;
    }

    .order-card:hover {
      transform: scale(1.01);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.05);
    }

    .order-info h4 {
      font-size: 1.2rem;
      color: var(--text-dark);
      margin-bottom: 6px;
      font-weight: 700;
    }

    .order-info p {
      font-size: 0.95rem;
      color: var(--muted);
    }

    .order-price {
      font-weight: 800;
      color: var(--primary-green);
      font-size: 1.3rem;
      margin-bottom: 8px;
      text-align: right;
    }

    .status {
      background: var(--light-green);
      color: var(--primary-green);
      padding: 8px 16px;
      border-radius: 50px;
      font-size: 0.85rem;
      font-weight: 700;
      display: inline-block;
      border: 1px solid rgba(46, 125, 50, 0.1);
    }

    /* QUICK ACTIONS */
    .quick-actions {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 60px;
    }

    .action-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: var(--radius-lg);
      padding: 25px;
      box-shadow: var(--shadow-sm);
      border: 1px solid rgba(255, 255, 255, 0.6);
      text-decoration: none;
      color: var(--text-dark);
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 12px;
    }

    .action-card:hover {
      transform: translateY(-5px);
      box-shadow: var(--shadow-md);
      border-color: var(--accent-green);
    }

    .action-icon {
      width: 55px;
      height: 55px;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--primary-green), var(--darker-green));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      color: white;
    }

    .action-card h4 {
      font-size: 1rem;
      font-weight: 700;
      color: var(--darker-green);
    }

    .action-card p {
      font-size: 0.85rem;
      color: var(--muted);
    }

    /* FEATURED MEALS */
    .featured-section {
      margin-bottom: 60px;
    }

    .featured-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 25px;
    }

    .featured-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      border: 1px solid rgba(255, 255, 255, 0.6);
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
    }

    .featured-card:hover {
      transform: translateY(-8px);
      box-shadow: var(--shadow-md);
    }

    .featured-img {
      width: 100%;
      height: 180px;
      background: var(--light-green);
      background-size: cover;
      background-position: center;
    }

    .featured-content {
      padding: 24px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .featured-tag {
      background: var(--accent-green);
      color: white;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.7rem;
      font-weight: 700;
      display: inline-block;
      margin-bottom: 10px;
    }

    .featured-content h4 {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--darker-green);
      margin-bottom: 8px;
    }

    .featured-content p {
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 15px;
    }

    .featured-price {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      margin-top: auto;
      margin-bottom: 15px;
    }

    .featured-price .old {
      text-decoration: line-through;
      color: #bbb;
      font-size: 0.85rem;
    }

    .featured-price .new {
      font-weight: 800;
      color: var(--primary-green);
      font-size: 1.3rem;
    }

    .featured-cta {
      background: rgba(255, 255, 255, 0.5);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.8);
      color: var(--darker-green);
      padding: 12px 24px;
      border-radius: 14px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      width: 100%;
      text-align: center;
    }

    .featured-cta:hover {
      background: rgba(255, 255, 255, 0.8);
      border-color: var(--accent-green);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(82, 183, 136, 0.2);
    }
  </style>
</head>

<body>

  <header class="site" id="siteHeader">
    <div class="nav-inner">
      <a href="userdashboard.html" class="logo">
        <span class="leaf">r.</span> ReServe
      </a>
      <nav class="menu">
        <a href="userdashboard.html" class="active">Dashboard</a>
        <a href="userbrowsemeal.html">Browse Meals</a>
        <a href="usercart.html">Cart</a>
        <a href="userhistory.html">History</a>
        <a href="userprofile.html">Profile</a>
        <a href="index.html" class="nav-cta">Logout</a>
      </nav>
    </div>
  </header>

  <main>
    <!-- WELCOME -->
    <section class="welcome-section">
      <div class="welcome-text">
        <h1>Welcome back, User!</h1>
        <p>Here's your food rescue impact today.</p>
      </div>
    </section>

    <!-- STATS -->
    <section class="stats-grid">
      <div class="stat-card">
        <div class="stat-icon">🍽️</div>
        <h3>Meals Rescued</h3>
        <span>0</span>
        <div class="stat-trend">↑ 0 this week</div>
      </div>

      <div class="stat-card">
        <div class="stat-icon">💰</div>
        <h3>Money Saved</h3>
        <span>RM 0.00</span>
        <div class="stat-trend">↑ RM 0.00 this week</div>
      </div>

      <div class="stat-card">
        <div class="stat-icon">🏪</div>
        <h3>Vendors Supported</h3>
        <span>0</span>
        <div class="stat-trend">↑ 0 new this week</div>
      </div>
    </section>


    <!-- ORDER HISTORY -->
    <section>
      <h2 class="section-title">Recent Orders</h2>

      <div class="recent-orders-container">
        <div style="text-align: center; padding: 40px; color: #777;">
          <p>Loading orders...</p>
        </div>
      </div>
    </section>
  </main>

  <!-- Firebase Scripts -->
  <script type="module" src="firebase-config.js"></script>
  <script type="module" src="userdashboard.js"></script>

  <script>
    // Glass nav: darken on scroll (consistent with index.html / meals.html)
    const siteHeader = document.getElementById('siteHeader');
    window.addEventListener('scroll', () => {
      siteHeader.classList.toggle('scrolled', window.scrollY > 10);
    }, { passive: true });
  </script>

</body>

</html>
