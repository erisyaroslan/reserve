<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>ReServe | User Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700&display=swap"
    rel="stylesheet">

  <style>
    :root {
      --primary-green: #2E7D32;
      --accent-green: #66BB6A;
      --light-green: #E8F5E9;
      --text-dark: #2f2f2f;
      --muted: #777;
      --radius: 20px;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
      --darker-green: #1B4332;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background:
        radial-gradient(circle at 0% 0%, #2D6A4F 0%, transparent 40%),
        radial-gradient(circle at 100% 0%, #52B788 0%, transparent 40%),
        radial-gradient(circle at 50% 50%, #D8E2DC 0%, #B7E4C7 100%);
      background-attachment: fixed;
      min-height: 100vh;
      color: var(--text-dark);
    }

    /* HEADER */
    header.dashboard {
      position: fixed;
      top: 0;
      width: 100%;
      height: 75px;
      background: linear-gradient(135deg, var(--primary-green), var(--accent-green));
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 8%;
      color: white;
      z-index: 1000;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
    }

    .logo {
      font-family: "Playfair Display", serif;
      font-size: 1.75rem;
      font-weight: 800;
      cursor: pointer;
    }

    .nav-links a.active {
      font-weight: 700;
      color: #073d05;
    }

    .nav-links {
      display: flex;
      gap: 20px;
      align-items: center;
    }

    .nav-links a {
      color: white;
      text-decoration: none;
      font-weight: 600;
    }

    .logout-btn {
      border: 1.5px solid white;
      padding: 8px 18px;
      border-radius: 12px;
    }

    .logout-btn:hover {
      background: white;
      color: var(--primary-green);
    }

    /* MAIN */
    main {
      padding: 120px 8% 50px;
      max-width: 1400px;
      margin: auto;
    }

    .welcome-section {
      margin-bottom: 40px;
    }

    .welcome-section h1 {
      font-family: "Playfair Display", serif;
      font-size: 3rem;
      color: var(--darker-green);
    }

    .welcome-section p {
      font-weight: 600;
      color: #0B291D;
      font-size: 1.1rem;
      margin-top: 8px;
    }

    /* STATS */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 25px;
      margin-bottom: 50px;
    }

    .stat-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(6px);
      border-radius: var(--radius);
      padding: 30px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(255, 255, 255, 0.4);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .stat-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.1);
    }

    .stat-card h3 {
      font-size: 0.95rem;
      color: var(--muted);
      margin-bottom: 12px;
      font-weight: 600;
    }

    .stat-card span {
      font-size: 2.5rem;
      font-weight: 800;
      color: var(--darker-green);
      display: block;
    }

    /* ORDER HISTORY */
    .section-title {
      font-family: "Playfair Display", serif;
      font-size: 2rem;
      color: var(--darker-green);
      margin-bottom: 25px;
    }

    .order-card {
      background: rgba(255, 255, 255, 0.95);
      border-radius: var(--radius);
      padding: 25px;
      box-shadow: var(--shadow);
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      transition: transform 0.2s;
    }

    .order-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.08);
    }

    .order-info h4 {
      font-size: 1.1rem;
      color: var(--text-dark);
      margin-bottom: 5px;
    }

    .order-info p {
      font-size: 0.9rem;
      color: var(--muted);
    }

    .order-price {
      font-weight: 800;
      color: var(--darker-green);
      font-size: 1.2rem;
      margin-bottom: 8px;
    }

    .status {
      background: var(--light-green);
      color: var(--darker-green);
      padding: 6px 14px;
      border-radius: 12px;
      font-size: 0.8rem;
      font-weight: 700;
      display: inline-block;
    }
  </style>
</head>

<body>

  <header class="dashboard active-page">
    <div class="logo">ReServe 🌱</div>
    <nav class="nav-links">
      <a href="userdashboard.html" class="active">Dashboard</a>
      <a href="userbrowsemeal.html">Browse Meals</a>
      <a href="usercart.html">Cart</a>
      <a href="userhistory.html">History</a>
      <a href="userprofile.html">Profile</a>
      <a href="index.html" class="logout-btn">Logout</a>
    </nav>
  </header>

  <main>
    <!-- WELCOME -->
    <section class="welcome-section">
      <h1>Welcome back, User!</h1>
      <p>Here's your food rescue impact today.</p>
    </section>

    <!-- STATS -->
    <section class="stats-grid">
      <div class="stat-card">
        <h3>Meals Rescued</h3>
        <span>0</span>
      </div>

      <div class="stat-card">
        <h3>Money Saved</h3>
        <span>RM 0.00</span>
      </div>
    </section>

    <!-- ORDER HISTORY -->
    <section>
      <h2 class="section-title">Recent Orders</h2>
      
      <div class="recent-orders-container">
        <div style="text-align: center; padding: 40px; color: #777;">
          <p>Loading orders...</p>
        </div>
      </div>
    </section>
  </main>

  <!-- Firebase Scripts -->
  <script type="module" src="firebase-config.js"></script>
  <script type="module" src="userdashboard.js"></script>

</body>

</html>
