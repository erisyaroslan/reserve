<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>ReServe | Profile</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700&display=swap"
    rel="stylesheet">

  <style>
    :root {
      --primary-green: #2E7D32;
      --accent-green: #66BB6A;
      --light-green: #E8F5E9;
      --text-dark: #2f2f2f;
      --muted: #777;
      --radius: 20px;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
      --darker-green: #1B4332;
      --white: #fff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background: var(--light-green);
      padding-bottom: 80px;
    }

    /* HEADER */
    header.dashboard {
      position: fixed;
      top: 0;
      width: 100%;
      height: 75px;
      background: linear-gradient(135deg, var(--primary-green), var(--accent-green));
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 8%;
      color: white;
      z-index: 1000;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
    }

    .logo {
      font-family: "Playfair Display", serif;
      font-size: 1.75rem;
      font-weight: 800;
      cursor: pointer;
    }

    .nav-links a.active {
      font-weight: 700;
      color: #073d05;
    }

    .nav-links {
      display: flex;
      gap: 16px;
      align-items: center;
      flex-wrap: nowrap;
    }

    .nav-links a {
      color: white;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      white-space: nowrap;
    }

    .logout-btn {
      border: 1.5px solid white;
      padding: 8px 18px;
      border-radius: 12px;
      flex-shrink: 0;
    }

    .logout-btn:hover {
      background: white;
      color: var(--primary-green);
    }

    main {
      padding: 100px 8% 20px;
    }

    /* PROFILE CARD */
    .profile-card {
      background: var(--white);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 30px;
      max-width: 700px;
      margin: auto;
    }

    .photo-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-bottom: 30px;
    }

    .profile-photo {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: #ddd;
      background-size: cover;
      background-position: center;
    }

    .photo-btn {
      font-size: 0.85rem;
      padding: 6px 16px;
      background: var(--accent-green);
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 600;
    }

    .photo-btn:hover {
      background: var(--primary-green);
    }

    .profile-name {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 2px solid #f0f0f0;
    }

    .profile-name span {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--darker-green);
    }

    .profile-info {
      display: grid;
      grid-template-columns: 1fr auto;
      row-gap: 20px;
      column-gap: 20px;
      align-items: center;
      margin-bottom: 30px;
    }

    .profile-info span {
      font-size: 1rem;
      color: var(--text-dark);
    }

    .btn-edit {
      background: var(--accent-green);
      color: white;
      border: none;
      padding: 6px 16px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
      transition: background 0.2s;
    }

    .btn-edit:hover {
      background: var(--primary-green);
    }

    .btn-logout {
      width: 100%;
      padding: 14px;
      border-radius: 14px;
      border: none;
      background: var(--primary-green);
      color: white;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-logout:hover {
      background: var(--darker-green);
    }
  </style>
</head>

<body>

  <header class="dashboard">
    <div class="logo">ReServe 🌱</div>
    <nav class="nav-links">
      <a href="userdashboard.html">Dashboard</a>
      <a href="userbrowsemeal.html">Browse Meals</a>
      <a href="usercart.html">Cart</a>
      <a href="userhistory.html">History</a>
      <a href="userprofile.html" class="active">Profile</a>
      <a href="index.html" class="logout-btn">Logout</a>
    </nav>
  </header>

  <main>
    <div class="profile-card">
      
      <!-- Photo Section -->
      <div class="photo-section">
        <div class="profile-photo" id="profilePhoto"></div>
        <button class="photo-btn" onclick="uploadPhoto()">Change Photo</button>
        <input type="file" id="photoInput" accept="image/*" hidden>
      </div>

      <!-- Name -->
      <div class="profile-name">
        <span id="nameText">Loading...</span>
        <button class="btn-edit" onclick="toggleEdit('name', this)">Edit</button>
      </div>

      <!-- Other Info -->
      <div class="profile-info">
        <span id="emailText">Email: Loading...</span>
        <button class="btn-edit" onclick="toggleEdit('email', this)">Edit</button>

        <span id="facultyText">Faculty: Loading...</span>
        <button class="btn-edit" onclick="toggleEdit('faculty', this)">Edit</button>
      </div>

      <!-- Logout Button -->
      <button class="btn-logout" onclick="logout()">Logout</button>
    </div>
  </main>

  <!-- Firebase Scripts -->
  <script type="module" src="firebase-config.js"></script>
  <script type="module" src="userprofile.js"></script>

</body>

</html>
