<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ReServe | Checkout</title>
  <link rel="icon" type="image/png" href="image/favicon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700&display=swap"
    rel="stylesheet">

  <style>
    :root {
      --deep-green: #0F3D2E;
      --darker-green: #1B4332;
      --primary-green: #2E7D32;
      --green: #2F8F4E;
      --accent-green: #52B788;
      --soft-green: #74C69D;
      --mint: #B7E4C7;
      --light-green: #EAF6EE;
      --cream: #F6FBF5;
      --text-dark: #16271E;
      --muted: #5C7066;
      --white: #ffffff;
      --deep-sage: #0F3D2E;
      --glass: rgba(255, 255, 255, 0.78);
      --radius-lg: 28px;
      --shadow-sm: 0 8px 24px rgba(15, 61, 46, 0.06);
      --shadow-md: 0 18px 50px rgba(15, 61, 46, 0.10);
      --shadow-lg: 0 30px 70px rgba(15, 61, 46, 0.16);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background-color: var(--deep-green);
      min-height: 100vh;
      color: var(--text-dark);
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      background:
        radial-gradient(900px 600px at 88% -8%, rgba(82, 183, 136, 0.28), transparent 60%),
        radial-gradient(800px 700px at -10% 12%, rgba(46, 143, 78, 0.30), transparent 55%),
        radial-gradient(1200px 900px at 50% 120%, rgba(11, 41, 29, 0.55), transparent 60%),
        linear-gradient(180deg, var(--cream) 0%, var(--light-green) 100%);
    }

    /* HEADER (Glass pill style) */
    header.site {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1000;
      transition: all 0.35s ease;
    }

    .nav-inner {
      max-width: 1240px;
      margin: 14px auto 0;
      width: calc(100% - 48px);
      height: 70px;
      padding: 0 14px 0 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(18px) saturate(140%);
      -webkit-backdrop-filter: blur(18px) saturate(140%);
      box-shadow: var(--shadow-sm);
      transition: all 0.35s ease;
    }

    header.site.scrolled .nav-inner {
      background: linear-gradient(135deg, rgba(15, 61, 46, 0.92), rgba(27, 67, 50, 0.92));
      border-color: rgba(255, 255, 255, 0.14);
      box-shadow: var(--shadow-md);
      margin-top: 8px;
    }

    .logo {
      font-family: "Playfair Display", serif;
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--deep-green);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
    }

    .logo .leaf {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent-green), var(--primary-green));
      color: #fff;
      font-size: 1.1rem;
      font-weight: 800;
      font-family: "Playfair Display", serif;
      box-shadow: 0 6px 14px rgba(46, 125, 50, 0.35);
    }

    header.site.scrolled .logo {
      color: #fff;
    }

    main {
      padding: 150px 8% 50px;
      max-width: 700px;
      margin: auto;
      animation: fadeIn 0.8s ease-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* BOX / CARD STYLING */
    .box {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: var(--radius-lg);
      padding: 30px;
      margin-bottom: 25px;
      box-shadow: var(--shadow-sm);
      border: 1px solid rgba(255, 255, 255, 0.6);
    }

    h3 {
      font-family: 'Playfair Display', serif;
      font-size: 1.6rem;
      color: var(--darker-green);
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* ORDER SUMMARY ITEMS */
    .summary p {
      display: flex;
      justify-content: space-between;
      margin: 12px 0;
      font-size: 1.05rem;
      color: var(--muted);
      font-weight: 500;
    }

    .summary p strong {
      color: var(--primary-green);
      font-weight: 800;
      font-size: 1.2rem;
    }

    /* PAYMENT METHOD OPTIONS */
    label {
      display: flex;
      align-items: center;
      padding: 18px;
      margin-bottom: 10px;
      cursor: pointer;
      border-radius: var(--radius-sm);
      border: 2px solid #f0f0f0;
      transition: all 0.3s ease;
      font-weight: 600;
      color: var(--text-dark);
    }

    label:hover {
      border-color: var(--accent-green);
      background: var(--light-green);
    }

    input[type="radio"] {
      appearance: none;
      width: 20px;
      height: 20px;
      border: 2px solid var(--primary-green);
      border-radius: 50%;
      margin-right: 15px;
      position: relative;
    }

    input[type="radio"]:checked {
      background: var(--primary-green);
      box-shadow: inset 0 0 0 4px white;
    }

    /* ACTION BUTTON */
    .btn-pay {
      width: 100%;
      background: linear-gradient(135deg, var(--primary-green), var(--darker-green));
      color: white;
      border: none;
      padding: 16px;
      font-size: 1.1rem;
      border-radius: 18px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 10px 25px rgba(46, 125, 50, 0.2);
    }

    .btn-pay:hover {
      transform: translateY(-2px);
      filter: brightness(1.1);
      box-shadow: 0 15px 30px rgba(46, 125, 50, 0.3);
    }

    /* POPUP STYLING */
    .popup-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(26, 26, 26, 0.6);
      backdrop-filter: blur(8px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 2000;
    }

    .popup-box {
      background: white;
      padding: 45px;
      border-radius: 30px;
      width: 90%;
      max-width: 420px;
      text-align: center;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.15);
      animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popIn {
      from {
        transform: scale(0.8);
        opacity: 0;
      }

      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    .popup-box h2 {
      font-family: 'Playfair Display', serif;
      color: var(--primary-green);
      margin-bottom: 15px;
      font-size: 2.2rem;
    }

    .popup-box p {
      margin-bottom: 30px;
      font-size: 1rem;
      color: var(--muted);
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <header class="site" id="siteHeader">
    <div class="nav-inner">
      <a href="usercart.html" class="logo">
        <span class="leaf">r.</span> ReServe
      </a>
    </div>
  </header>

  <main>
    <div class="box summary">
      <h3>Order Summary</h3>
      <p>Total Items <span><span id="totalItems">0</span> items</span></p>
      <p>Total Price <strong>RM <span id="totalPrice">0.00</span></strong></p>
    </div>

    <div class="box">
      <h3>Payment Method</h3>
      <label>
        <input type="radio" name="payment" value="cash" checked>
        Cash on Pickup
      </label>
    </div>

    <button class="btn-pay" onclick="confirmPayment()">Confirm & Place Order</button>

    <div class="popup-overlay" id="successPopup">
      <div class="popup-box">
        <h2>🎉 Success!</h2>
        <p>Your order has been placed. You can pay when you pick up your meal.</p>
        <button class="btn-pay" onclick="goToOrders()">View My Orders</button>
      </div>
    </div>
  </main>

  <script type="module" src="firebase-config.js"></script>
  <script type="module" src="checkout.js"></script>

  <script>
    // Glass nav: darken on scroll (consistent with index.html / meals.html)
    const siteHeader = document.getElementById('siteHeader');
    window.addEventListener('scroll', () => {
      siteHeader.classList.toggle('scrolled', window.scrollY > 10);
    }, { passive: true });
  </script>

</body>

</html>
