<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>ReServe | My Orders</title>
  <link rel="icon" type="image/png" href="image/favicon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700&display=swap"
    rel="stylesheet">

  <style>
    :root {
      --deep-green: #0F3D2E;
      --darker-green: #1B4332;
      --primary-green: #2E7D32;
      --green: #2F8F4E;
      --accent-green: #52B788;
      --soft-green: #74C69D;
      --mint: #B7E4C7;
      --light-green: #EAF6EE;
      --cream: #F6FBF5;
      --text-dark: #16271E;
      --muted: #5C7066;
      --white: #ffffff;
      --deep-sage: #0F3D2E;
      --glass: rgba(255, 255, 255, 0.78);
      --radius-lg: 28px;
      --shadow-sm: 0 8px 24px rgba(15, 61, 46, 0.06);
      --shadow-md: 0 18px 50px rgba(15, 61, 46, 0.10);
      --shadow-lg: 0 30px 70px rgba(15, 61, 46, 0.16);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background-color: var(--deep-green);
      padding-bottom: 80px;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      background:
        radial-gradient(900px 600px at 88% -8%, rgba(82, 183, 136, 0.28), transparent 60%),
        radial-gradient(800px 700px at -10% 12%, rgba(46, 143, 78, 0.30), transparent 55%),
        radial-gradient(1200px 900px at 50% 120%, rgba(11, 41, 29, 0.55), transparent 60%),
        linear-gradient(180deg, var(--cream) 0%, var(--light-green) 100%);
    }

    header.site {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1000;
      transition: all 0.35s ease;
    }

    .nav-inner {
      max-width: 1240px;
      margin: 14px auto 0;
      width: calc(100% - 48px);
      height: 70px;
      padding: 0 14px 0 26px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(18px) saturate(140%);
      -webkit-backdrop-filter: blur(18px) saturate(140%);
      box-shadow: var(--shadow-sm);
      transition: all 0.35s ease;
    }

    header.site.scrolled .nav-inner {
      background: linear-gradient(135deg, rgba(15, 61, 46, 0.92), rgba(27, 67, 50, 0.92));
      border-color: rgba(255, 255, 255, 0.14);
      box-shadow: var(--shadow-md);
      margin-top: 8px;
    }

    .logo {
      font-family: "Playfair Display", serif;
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--deep-green);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
    }

    .logo .leaf {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent-green), var(--primary-green));
      color: #fff;
      font-size: 1.1rem;
      font-weight: 800;
      font-family: "Playfair Display", serif;
      box-shadow: 0 6px 14px rgba(46, 125, 50, 0.35);
    }

    nav.menu {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    nav.menu a {
      color: var(--darker-green);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.92rem;
      padding: 9px 16px;
      border-radius: 12px;
      transition: all 0.25s ease;
    }

    nav.menu a:hover {
      background: rgba(46, 125, 50, 0.10);
      color: var(--primary-green);
    }

    nav.menu a.active {
      color: var(--primary-green);
      background: rgba(46, 125, 50, 0.12);
    }

    .nav-cta {
      margin-left: 8px;
      background: linear-gradient(135deg, var(--green), var(--darker-green));
      color: #fff !important;
      padding: 11px 22px !important;
      border-radius: 14px;
      box-shadow: 0 10px 22px rgba(27, 67, 50, 0.25);
    }

    .nav-cta:hover {
      transform: translateY(-2px);
    }

    header.site.scrolled .logo {
      color: #fff;
    }

    header.site.scrolled nav.menu a {
      color: rgba(255, 255, 255, 0.88);
    }

    header.site.scrolled nav.menu a:hover,
    header.site.scrolled nav.menu a.active {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
    }

    header.site.scrolled .nav-cta {
      background: linear-gradient(135deg, var(--accent-green), var(--soft-green)) !important;
      color: var(--deep-green) !important;
    }

    main {
      padding: 150px 8% 40px;
      max-width: 1000px;
      margin: auto;
      animation: fadeIn 0.8s ease-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h2 {
      color: var(--darker-green);
      margin-bottom: 30px;
      font-family: 'Playfair Display', serif;
      font-size: 2.8rem;
      font-weight: 700;
    }

    .order-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: var(--radius-lg);
      padding: 25px;
      margin-bottom: 25px;
      box-shadow: var(--shadow-sm);
      border: 1px solid rgba(255, 255, 255, 0.6);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .order-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.06);
    }

    .order-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      font-weight: 700;
      color: var(--darker-green);
      font-size: 1.1rem;
    }

    .order-meals {
      border-top: 1px solid #f0f0f0;
      padding-top: 20px;
    }

    .meal-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding: 8px 0;
    }

    .meal-item p {
      color: var(--text-dark);
      font-weight: 500;
      font-size: 1rem;
    }

    .meal-item .price {
      font-weight: 700;
      color: var(--primary-green);
      background: var(--light-green);
      padding: 4px 12px;
      border-radius: 8px;
    }

    .btn-action {
      background: linear-gradient(135deg, var(--primary-green), var(--darker-green));
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 14px;
      font-weight: 600;
      transition: all 0.3s ease;
      box-shadow: 0 4px 12px rgba(46, 125, 50, 0.15);
      cursor: pointer;
    }

    .btn-action:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(46, 125, 50, 0.25);
      filter: brightness(1.1);
    }

    .btn-qr {
      background: #2E7D32 !important;
    }

    .order-footer {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 2px dashed #f0f0f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .order-footer>div:first-child {
      font-weight: 800;
      color: var(--darker-green);
      font-size: 1.3rem;
      letter-spacing: -0.5px;
    }

    .custom-modal {
      display: none;
      position: fixed;
      z-index: 2000;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(4px);
      align-items: center;
      justify-content: center;
    }

    .modal-content {
      background: white;
      padding: 30px;
      border-radius: var(--radius-lg);
      max-width: 400px;
      width: 90%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
    }

    .modal-actions {
      display: flex;
      gap: 12px;
      margin-top: 25px;
    }

    .btn-secondary {
      flex: 1;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid #ddd;
      background: #f5f5f5;
      cursor: pointer;
      font-weight: 600;
    }

    .btn-danger {
      flex: 1;
      padding: 12px;
      border-radius: 12px;
      border: none;
      background: #d32f2f;
      color: white;
      cursor: pointer;
      font-weight: 600;
    }

    #qrCanvas {
      background: white;
      padding: 10px;
      border-radius: 16px;
    }
  </style>
</head>

<body>

  <header class="site" id="siteHeader">
    <div class="nav-inner">
      <a href="userdashboard.html" class="logo">
        <span class="leaf">r.</span> ReServe
      </a>
      <nav class="menu">
        <a href="userdashboard.html">Dashboard</a>
        <a href="userbrowsemeal.html">Browse Meals</a>
        <a href="usercart.html">Cart</a>
        <a href="userhistory.html" class="active">History</a>
        <a href="userprofile.html">Profile</a>
        <a href="index.html" class="nav-cta">Logout</a>
      </nav>
    </div>
  </header>

  <main>
    <h2>My Orders</h2>

    <div id="ordersContainer">
      <div style="text-align: center; padding: 40px; color: #777;"></div>
    </div>
  </main>

  <div id="cancelModal" class="custom-modal">
    <div class="modal-content">
      <h3>Cancel Order?</h3>
      <p>Are you sure you want to cancel this order? This action will restore the items to the vendor's stock.</p>
      <div class="modal-actions">
        <button onclick="closeCancelModal()" class="btn-secondary">No, Keep Order</button>
        <button id="confirmCancelBtn" class="btn-danger">Yes, Cancel Order</button>
      </div>
    </div>
  </div>

  <div id="qrModal" class="custom-modal">
    <div class="modal-content">
      <h3 style="margin-bottom: 15px;">Pickup QR Code</h3>

      <p style="color:#666; margin-bottom:20px;">
        Show this QR to vendor during pickup
      </p>

      <div style="display:flex; justify-content:center; margin-bottom:20px;">
        <canvas id="qrCanvas"></canvas>
      </div>

      <p id="qrOrderText" style="font-weight:700; color:#2E7D32; margin-bottom:20px;"></p>

      <button onclick="closeQRModal()" class="btn-secondary" style="width:100%;">
        Close
      </button>
    </div>
  </div>

  <script type="module" src="firebase-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
  <script type="module" src="userhistory.js"></script>

  <script>
    // Glass nav: darken on scroll (consistent with index.html / meals.html)
    const siteHeader = document.getElementById('siteHeader');
    window.addEventListener('scroll', () => {
      siteHeader.classList.toggle('scrolled', window.scrollY > 10);
    }, { passive: true });
  </script>

</body>

</html>
