<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>ReServe | My Orders</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700&display=swap"
    rel="stylesheet">

  <style>
    :root {
      --primary-green: #2E7D32;
      --accent-green: #66BB6A;
      --light-green: #E8F5E9;
      --text-dark: #2f2f2f;
      --muted: #777;
      --radius: 20px;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
      --darker-green: #1B4332;
      --white: #fff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background: var(--light-green);
      padding-bottom: 80px;
    }

    /* HEADER */
    header.dashboard {
      position: fixed;
      top: 0;
      width: 100%;
      height: 75px;
      background: linear-gradient(135deg, var(--primary-green), var(--accent-green));
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 8%;
      color: white;
      z-index: 1000;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
    }

    .logo {
      font-family: "Playfair Display", serif;
      font-size: 1.75rem;
      font-weight: 800;
      cursor: pointer;
    }

    .nav-links a.active {
      font-weight: 700;
      color: #073d05;
    }

    .nav-links {
      display: flex;
      gap: 16px;
      align-items: center;
      flex-wrap: nowrap;
    }

    .nav-links a {
      color: white;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      white-space: nowrap;
    }

    .logout-btn {
      border: 1.5px solid white;
      padding: 8px 18px;
      border-radius: 12px;
      flex-shrink: 0;
    }

    .logout-btn:hover {
      background: white;
      color: var(--primary-green);
    }

    main {
      padding: 100px 8% 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    h2 {
      margin-bottom: 20px;
      color: var(--darker-green);
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
    }

    /* ORDER CARDS */
    .order-card {
      background: var(--white);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .order-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.08);
    }

    .order-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      font-weight: 600;
      color: var(--darker-green);
      flex-wrap: wrap;
      gap: 10px;
    }

    .order-meals {
      border-top: 1px solid #eee;
      padding-top: 15px;
    }

    .meal-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      gap: 15px;
    }

    .meal-item p {
      margin: 0;
      font-size: 0.95rem;
      color: var(--text-dark);
    }

    .meal-item .price {
      font-weight: 700;
      color: var(--darker-green);
      white-space: nowrap;
    }

    .btn-action {
      background: var(--primary-green);
      color: var(--white);
      border: none;
      padding: 8px 16px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      transition: background 0.2s, transform 0.2s;
    }

    .btn-action:hover {
      background: var(--darker-green);
      transform: translateY(-1px);
    }

    .order-footer {
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid #f0f0f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .order-footer > div:first-child {
      font-weight: 700;
      color: var(--text-dark);
      font-size: 1.1rem;
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <header class="dashboard">
    <div class="logo">ReServe 🌱</div>
    <nav class="nav-links">
      <a href="userdashboard.html">Dashboard</a>
      <a href="userbrowsemeal.html">Browse Meals</a>
      <a href="usercart.html">Cart</a>
      <a href="userhistory.html" class="active">History</a>
      <a href="userprofile.html">Profile</a>
      <a href="index.html" class="logout-btn">Logout</a>
    </nav>
  </header>

  <main>
    <h2>My Orders</h2>

    <!-- Orders will be loaded dynamically here by JavaScript -->
    <div id="ordersContainer">
      <div style="text-align: center; padding: 40px; color: #777;">
        
      </div>
    </div>

  </main>

  <!-- Firebase Scripts -->
  <script type="module" src="firebase-config.js"></script>
  <script type="module" src="userhistory.js"></script>

</body>

</html>
