<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>ReServe | My Orders</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700&display=swap"
    rel="stylesheet">

  <style>
    :root {
      --primary-green: #2E7D32;
      --accent-green: #66BB6A;
      --light-green: #E8F5E9;
      --text-dark: #2f2f2f;
      --muted: #777;
      --radius: 20px;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
      --darker-green: #1B4332;
      --white: #fff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background: var(--light-green);
      padding-bottom: 80px;
    }

    /* HEADER */
    header.dashboard {
      position: fixed;
      top: 0;
      width: 100%;
      height: 75px;
      background: linear-gradient(135deg, var(--primary-green), var(--accent-green));
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 8%;
      color: white;
      z-index: 1000;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
    }

    .logo {
      font-family: "Playfair Display", serif;
      font-size: 1.75rem;
      font-weight: 800;
      cursor: pointer;
    }

    .nav-links a.active {
      font-weight: 700;
      color: #073d05;
    }

    .nav-links {
      display: flex;
      gap: 16px;
      align-items: center;
      flex-wrap: nowrap;
    }

    .nav-links a {
      color: white;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      white-space: nowrap;
    }

    .logout-btn {
      border: 1.5px solid white;
      padding: 8px 18px;
      border-radius: 12px;
      flex-shrink: 0;
    }

    .logout-btn:hover {
      background: white;
      color: var(--primary-green);
    }

    main {
      padding: 100px 8% 20px;
    }

    /* ORDER CARDS */
    .order-card {
      background: var(--white);
      border-radius: var(--radius);
      padding: 15px;
      margin-bottom: 18px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
    }

    .order-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      font-weight: 600;
      color: var(--darker-green);
    }

    .order-meals {
      border-top: 1px solid #eee;
      padding-top: 10px;
    }

    .meal-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .meal-item p {
      margin: 0;
      font-size: 0.95rem;
      color: var(--text-dark);
    }

    .meal-item .price {
      font-weight: 700;
      color: var(--darker-green);
    }

    .btn-action {
      background: var(--primary-green);
      color: var(--white);
      border: none;
      padding: 6px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.9rem;
      margin-left: 8px;
    }

    .btn-action:hover {
      background: var(--darker-green);
    }

    .order-footer {
      margin-top: 10px;
      text-align: right;
      font-weight: 600;
      color: var(--text-dark);
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <header class="dashboard">
    <div class="logo">ReServe 🌱</div>
    <nav class="nav-links">
      <a href="userdashboard.html">Dashboard</a>
      <a href="userbrowsemeal.html">Browse Meals</a>
      <a href="usercart.html">Cart</a>
      <a href="userhistory.html" class="active">History</a>
      <a href="userprofile.html">Profile</a>
      <a href="index.html" class="logout-btn">Logout</a>
    </nav>
  </header>

  <main>
    <h2 style="margin-bottom: 20px; color: var(--darker-green);">My Orders</h2>

    <!-- ORDER 1 -->
    <div class="order-card">
      <div class="order-header">
        <span>Order #001 - 12 Jan 2026</span>
        <span>Status: Completed</span>
      </div>
      <div class="order-meals">
        <div class="meal-item">
          <p>Egg Mayo Sandwich</p>
          <span class="price">RM 3.00</span>
        </div>
        <div class="meal-item">
          <p>Nasi Lemak Ayam</p>
          <span class="price">RM 4.50</span>
        </div>
      </div>
      <div class="order-footer">
        Total: RM 7.50
      </div>
    </div>

    <!-- ORDER 2 -->
    <div class="order-card">
      <div class="order-header">
        <span>Order #002 - 10 Jan 2026</span>
        <span>Status: Completed</span>
      </div>
      <div class="order-meals">
        <div class="meal-item">
          <p>Spaghetti Bolognese</p>
          <span class="price">RM 6.00</span>
        </div>
      </div>
      <div class="order-footer">
        Total: RM 6.00

      </div>
    </div>

  </main>

</body>

</html>
