<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>ReServe | My Orders</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700&display=swap"
    rel="stylesheet">

  <style>
    :root {
      --primary-green: #2E7D32;
      --accent-green: #66BB6A;
      --light-green: #F1F8E9;
      --text-dark: #1A1A1A;
      --muted: #627264;
      --radius-lg: 24px;
      --radius-sm: 14px;
      --shadow: 0 10px 40px rgba(0, 0, 0, 0.04);
      --darker-green: #1B4332;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background: var(--light-green);
      background-image: radial-gradient(circle at top right, #E8F5E9 0%, #F1F8E9 100%);
      padding-bottom: 80px;
      min-height: 100vh;
    }

    header.dashboard {
      position: fixed;
      top: 0;
      width: 100%;
      height: 80px;
      background: rgba(46, 125, 50, 0.9);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 8%;
      color: white;
      z-index: 1000;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .logo {
      font-family: 'Playfair Display', serif;
      font-size: 1.8rem;
      font-weight: 800;
      background: linear-gradient(to right, #fff, #C8E6C9);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .nav-links {
      display: flex;
      gap: 24px;
      align-items: center;
    }

    .nav-links a {
      color: rgba(255, 255, 255, 0.8);
      text-decoration: none;
      font-weight: 500;
      font-size: 0.9rem;
      position: relative;
    }

    .nav-links a.active {
      color: white;
      font-weight: 700;
    }

    .nav-links a.active::after {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 0;
      width: 100%;
      height: 2px;
      background: var(--accent-green);
      border-radius: 2px;
    }

    .logout-btn {
      border: 1.5px solid rgba(255, 255, 255, 0.3);
      padding: 8px 20px;
      border-radius: 50px;
      background: rgba(255, 255, 255, 0.1);
      color: white;
    }

    main {
      padding: 120px 8% 40px;
      max-width: 1000px;
      margin: auto;
      animation: fadeIn 0.8s ease-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h2 {
      color: var(--darker-green);
      margin-bottom: 30px;
      font-family: 'Playfair Display', serif;
      font-size: 2.8rem;
      font-weight: 700;
    }

    .order-card {
      background: var(--white);
      border-radius: var(--radius-lg);
      padding: 25px;
      margin-bottom: 25px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(255, 255, 255, 0.5);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .order-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.06);
    }

    .order-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      font-weight: 700;
      color: var(--darker-green);
      font-size: 1.1rem;
    }

    .order-meals {
      border-top: 1px solid #f0f0f0;
      padding-top: 20px;
    }

    .meal-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding: 8px 0;
    }

    .meal-item p {
      color: var(--text-dark);
      font-weight: 500;
      font-size: 1rem;
    }

    .meal-item .price {
      font-weight: 700;
      color: var(--primary-green);
      background: var(--light-green);
      padding: 4px 12px;
      border-radius: 8px;
    }

    .btn-action {
      background: linear-gradient(135deg, var(--primary-green), var(--darker-green));
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 14px;
      font-weight: 600;
      transition: all 0.3s ease;
      box-shadow: 0 4px 12px rgba(46, 125, 50, 0.15);
      cursor: pointer;
    }

    .btn-action:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(46, 125, 50, 0.25);
      filter: brightness(1.1);
    }

    .btn-qr {
      background: #2E7D32 !important;
    }

    .order-footer {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 2px dashed #f0f0f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .order-footer>div:first-child {
      font-weight: 800;
      color: var(--darker-green);
      font-size: 1.3rem;
      letter-spacing: -0.5px;
    }

    .custom-modal {
      display: none;
      position: fixed;
      z-index: 2000;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(4px);
      align-items: center;
      justify-content: center;
    }

    .modal-content {
      background: white;
      padding: 30px;
      border-radius: var(--radius-lg);
      max-width: 400px;
      width: 90%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
    }

    .modal-actions {
      display: flex;
      gap: 12px;
      margin-top: 25px;
    }

    .btn-secondary {
      flex: 1;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid #ddd;
      background: #f5f5f5;
      cursor: pointer;
      font-weight: 600;
    }

    .btn-danger {
      flex: 1;
      padding: 12px;
      border-radius: 12px;
      border: none;
      background: #d32f2f;
      color: white;
      cursor: pointer;
      font-weight: 600;
    }

    #qrCanvas {
      background: white;
      padding: 10px;
      border-radius: 16px;
    }
  </style>
</head>

<body>

  <header class="dashboard">
    <div class="logo">ReServe 🌱</div>
    <nav class="nav-links">
      <a href="userdashboard.html">Dashboard</a>
      <a href="userbrowsemeal.html">Browse Meals</a>
      <a href="usercart.html">Cart</a>
      <a href="userhistory.html" class="active">History</a>
      <a href="userprofile.html">Profile</a>
      <a href="index.html" class="logout-btn">Logout</a>
    </nav>
  </header>

  <main>
    <h2>My Orders</h2>

    <div id="ordersContainer">
      <div style="text-align: center; padding: 40px; color: #777;"></div>
    </div>
  </main>

  <div id="cancelModal" class="custom-modal">
    <div class="modal-content">
      <h3>Cancel Order?</h3>
      <p>Are you sure you want to cancel this order? This action will restore the items to the vendor's stock.</p>
      <div class="modal-actions">
        <button onclick="closeCancelModal()" class="btn-secondary">No, Keep Order</button>
        <button id="confirmCancelBtn" class="btn-danger">Yes, Cancel Order</button>
      </div>
    </div>
  </div>

  <div id="qrModal" class="custom-modal">
    <div class="modal-content">
      <h3 style="margin-bottom: 15px;">Pickup QR Code</h3>

      <p style="color:#666; margin-bottom:20px;">
        Show this QR to vendor during pickup
      </p>

      <div style="display:flex; justify-content:center; margin-bottom:20px;">
        <canvas id="qrCanvas"></canvas>
      </div>

      <p id="qrOrderText" style="font-weight:700; color:#2E7D32; margin-bottom:20px;"></p>

      <button onclick="closeQRModal()" class="btn-secondary" style="width:100%;">
        Close
      </button>
    </div>
  </div>

  <script type="module" src="firebase-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
  <script type="module" src="userhistory.js"></script>

</body>

</html>
