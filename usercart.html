<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>ReServe | Cart</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700&display=swap"
    rel="stylesheet">

  <style>
    :root {
      --primary-green: #2E7D32;
      --accent-green: #66BB6A;
      --light-green: #F1F8E9;
      /* Slightly softer cream-green */
      --text-dark: #1A1A1A;
      --muted: #627264;
      --radius-lg: 24px;
      --radius-sm: 12px;
      --shadow: 0 10px 40px rgba(0, 0, 0, 0.04);
      --darker-green: #1B4332;
      --white: #ffffff;
      --glass: rgba(255, 255, 255, 0.8);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background: var(--light-green);
      background-image: radial-gradient(circle at top right, #E8F5E9 0%, #F1F8E9 100%);
      padding-bottom: 80px;
      color: var(--text-dark);
      min-height: 100vh;
    }

    /* HEADER (Matches Browse, Cart, History) */
    header.dashboard {
      position: fixed;
      top: 0;
      width: 100%;
      height: 80px;
      background: rgba(46, 125, 50, 0.9);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 8%;
      color: white;
      z-index: 1000;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .logo {
      font-family: "Playfair Display", serif;
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(to right, #fff, #C8E6C9);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .nav-links {
      display: flex;
      gap: 24px;
      align-items: center;
    }

    .nav-links a {
      color: rgba(255, 255, 255, 0.8);
      text-decoration: none;
      font-weight: 500;
      font-size: 0.9rem;
      position: relative;
    }

    .nav-links a.active {
      color: white;
      font-weight: 700;
    }

    .nav-links a.active::after {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 0;
      width: 100%;
      height: 2px;
      background: var(--accent-green);
      border-radius: 2px;
    }

    .logout-btn {
      border: 1.5px solid rgba(255, 255, 255, 0.3);
      padding: 8px 20px;
      border-radius: 50px;
      background: rgba(255, 255, 255, 0.1);
      color: white;
      transition: all 0.3s;
    }

    .logout-btn:hover {
      background: white;
      color: var(--primary-green);
    }

    main {
      padding: 120px 8% 40px;
      max-width: 1100px;
      margin: auto;
      animation: fadeIn 0.8s ease-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h2 {
      color: var(--darker-green);
      margin-bottom: 30px;
      font-family: 'Playfair Display', serif;
      font-size: 2.8rem;
      font-weight: 700;
    }

    /* CART ITEM ENHANCEMENT */
    .cart-item {
      background: var(--white);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      padding: 20px;
      display: flex;
      align-items: center;
      margin-bottom: 20px;
      gap: 20px;
      border: 1px solid rgba(255, 255, 255, 0.5);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .cart-item:hover {
      transform: scale(1.01);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.06);
    }

    .cart-photo {
      width: 90px;
      height: 90px;
      border-radius: 18px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
    }

    .cart-info h4 {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-dark);
      margin-bottom: 4px;
    }

    .cart-info p {
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.4;
    }

    /* QUANTITY CONTROL ENHANCEMENT */
    .qty-control {
      background: #F5F7F5;
      padding: 6px 12px;
      border-radius: 50px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .qty-control button {
      background: var(--white);
      color: var(--primary-green);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      transition: all 0.2s;
    }

    .qty-control button:hover {
      background: var(--primary-green);
      color: white;
      transform: translateY(-1px);
    }

    .qty-control span {
      font-size: 1rem;
      color: var(--text-dark);
      font-weight: 700;
    }

    .price {
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--primary-green);
      letter-spacing: -0.5px;
    }

    .remove {
      background: #FFF5F5;
      color: #E53935;
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: all 0.2s;
    }

    .remove:hover {
      background: #FFEBEE;
      color: #B71C1C;
      text-decoration: none;
    }

    /* TOTAL BOX ENHANCEMENT */
    .total-box {
      background: var(--white);
      border-radius: var(--radius-lg);
      padding: 35px;
      margin-top: 30px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(46, 125, 50, 0.1);
      position: relative;
      overflow: hidden;
    }

    .total-box::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 5px;
      background: linear-gradient(to right, var(--accent-green), var(--primary-green));
    }

    .btn-checkout {
      margin-top: 20px;
      background: linear-gradient(135deg, var(--primary-green), var(--darker-green));
      padding: 16px 45px;
      border-radius: 16px;
      font-size: 1.1rem;
      letter-spacing: 0.5px;
      transition: all 0.3s ease;
    }

    .btn-checkout:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 15px 30px rgba(46, 125, 50, 0.3);
    }
  </style>
</head>

<body>
  <header class="dashboard">
    <div class="logo">ReServe 🌱</div>
    <nav class="nav-links">
      <a href="userdashboard.html">Dashboard</a>
      <a href="userbrowsemeal.html">Browse Meals</a>
      <a href="usercart.html" class="active">Cart</a>
      <a href="userhistory.html">History</a>
      <a href="userprofile.html">Profile</a>
      <a href="index.html" class="logout-btn">Logout</a>
    </nav>
  </header>

  <main>
    <h2>My Cart</h2>

    <!-- Cart items will be loaded here -->
    <div id="cartContainer">
      <div style="text-align: center; padding: 40px; color: #777;">
        <p>Loading cart...</p>
      </div>
    </div>

    <!-- Total box -->
    <div id="totalBox" class="total-box" style="display: none;">
      <!-- Total will be calculated here -->
    </div>
  </main>

  <!-- Firebase Scripts -->
  <script type="module" src="firebase-config.js"></script>
  <script type="module" src="usercart.js"></script>

</body>

</html>
