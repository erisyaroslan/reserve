<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>ReServe | Cart</title>
  <link rel="icon" type="image/png" href="image/favicon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700&display=swap"
    rel="stylesheet">

  <style>
    :root {
      --deep-green: #0F3D2E;
      --darker-green: #1B4332;
      --primary-green: #2E7D32;
      --green: #2F8F4E;
      --accent-green: #52B788;
      --soft-green: #74C69D;
      --mint: #B7E4C7;
      --light-green: #EAF6EE;
      --cream: #F6FBF5;
      --text-dark: #16271E;
      --muted: #5C7066;
      --white: #ffffff;
      --deep-sage: #0F3D2E;
      --glass: rgba(255, 255, 255, 0.78);
      --radius-lg: 28px;
      --shadow-sm: 0 8px 24px rgba(15, 61, 46, 0.06);
      --shadow-md: 0 18px 50px rgba(15, 61, 46, 0.10);
      --shadow-lg: 0 30px 70px rgba(15, 61, 46, 0.16);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background-color: var(--deep-green);
      padding-bottom: 80px;
      color: var(--text-dark);
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      background:
        radial-gradient(900px 600px at 88% -8%, rgba(82, 183, 136, 0.28), transparent 60%),
        radial-gradient(800px 700px at -10% 12%, rgba(46, 143, 78, 0.30), transparent 55%),
        radial-gradient(1200px 900px at 50% 120%, rgba(11, 41, 29, 0.55), transparent 60%),
        linear-gradient(180deg, var(--cream) 0%, var(--light-green) 100%);
    }

    /* HEADER (Glass pill style) */
    header.site {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1000;
      transition: all 0.35s ease;
    }

    .nav-inner {
      max-width: 1240px;
      margin: 14px auto 0;
      width: calc(100% - 48px);
      height: 70px;
      padding: 0 14px 0 26px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(18px) saturate(140%);
      -webkit-backdrop-filter: blur(18px) saturate(140%);
      box-shadow: var(--shadow-sm);
      transition: all 0.35s ease;
    }

    header.site.scrolled .nav-inner {
      background: linear-gradient(135deg, rgba(15, 61, 46, 0.92), rgba(27, 67, 50, 0.92));
      border-color: rgba(255, 255, 255, 0.14);
      box-shadow: var(--shadow-md);
      margin-top: 8px;
    }

    .logo {
      font-family: "Playfair Display", serif;
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--deep-green);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
    }

    .logo .leaf {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent-green), var(--primary-green));
      color: #fff;
      font-size: 1.1rem;
      font-weight: 800;
      font-family: "Playfair Display", serif;
      box-shadow: 0 6px 14px rgba(46, 125, 50, 0.35);
    }

    nav.menu {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    nav.menu a {
      color: var(--darker-green);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.92rem;
      padding: 9px 16px;
      border-radius: 12px;
      transition: all 0.25s ease;
    }

    nav.menu a:hover {
      background: rgba(46, 125, 50, 0.10);
      color: var(--primary-green);
    }

    nav.menu a.active {
      color: var(--primary-green);
      background: rgba(46, 125, 50, 0.12);
    }

    .nav-cta {
      margin-left: 8px;
      background: linear-gradient(135deg, var(--green), var(--darker-green));
      color: #fff !important;
      padding: 11px 22px !important;
      border-radius: 14px;
      box-shadow: 0 10px 22px rgba(27, 67, 50, 0.25);
    }

    .nav-cta:hover {
      transform: translateY(-2px);
    }

    header.site.scrolled .logo {
      color: #fff;
    }

    header.site.scrolled nav.menu a {
      color: rgba(255, 255, 255, 0.88);
    }

    header.site.scrolled nav.menu a:hover,
    header.site.scrolled nav.menu a.active {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
    }

    header.site.scrolled .nav-cta {
      background: linear-gradient(135deg, var(--accent-green), var(--soft-green)) !important;
      color: var(--deep-green) !important;
    }

    main {
      padding: 150px 8% 40px;
      max-width: 1100px;
      margin: auto;
      animation: fadeIn 0.8s ease-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h2 {
      color: var(--darker-green);
      margin-bottom: 30px;
      font-family: 'Playfair Display', serif;
      font-size: 2.8rem;
      font-weight: 700;
    }

    /* CART ITEM ENHANCEMENT */
    .cart-item {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      padding: 20px;
      display: flex;
      align-items: center;
      margin-bottom: 20px;
      gap: 20px;
      border: 1px solid rgba(255, 255, 255, 0.6);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .cart-item:hover {
      transform: scale(1.01);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.06);
    }

    .cart-photo {
      width: 90px;
      height: 90px;
      border-radius: 18px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
    }

    .cart-info h4 {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-dark);
      margin-bottom: 4px;
    }

    .cart-info p {
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.4;
    }

    /* QUANTITY CONTROL ENHANCEMENT */
    .qty-control {
      background: #F5F7F5;
      padding: 6px 12px;
      border-radius: 50px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .qty-control button {
      background: var(--white);
      color: var(--primary-green);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      transition: all 0.2s;
    }

    .qty-control button:hover {
      background: var(--primary-green);
      color: white;
      transform: translateY(-1px);
    }

    .qty-control span {
      font-size: 1rem;
      color: var(--text-dark);
      font-weight: 700;
    }

    .price {
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--primary-green);
      letter-spacing: -0.5px;
    }

    .remove {
      background: #FFF5F5;
      color: #E53935;
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: all 0.2s;
    }

    .remove:hover {
      background: #FFEBEE;
      color: #B71C1C;
      text-decoration: none;
    }

    /* TOTAL BOX ENHANCEMENT */
    .total-box {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: var(--radius-lg);
      padding: 35px;
      margin-top: 30px;
      box-shadow: var(--shadow-sm);
      border: 1px solid rgba(46, 125, 50, 0.1);
      position: relative;
      overflow: hidden;
    }

    .total-box::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 5px;
      background: linear-gradient(to right, var(--accent-green), var(--primary-green));
    }

    .btn-checkout {
      margin-top: 20px;
      background: linear-gradient(135deg, var(--primary-green), var(--darker-green));
      padding: 16px 45px;
      border-radius: 16px;
      font-size: 1.1rem;
      letter-spacing: 0.5px;
      transition: all 0.3s ease;
    }

    .btn-checkout:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 15px 30px rgba(46, 125, 50, 0.3);
    }
  </style>
</head>

<body>
  <header class="site" id="siteHeader">
    <div class="nav-inner">
      <a href="userdashboard.html" class="logo">
        <span class="leaf">r.</span> ReServe
      </a>
      <nav class="menu">
        <a href="userdashboard.html">Dashboard</a>
        <a href="userbrowsemeal.html">Browse Meals</a>
        <a href="usercart.html" class="active">Cart</a>
        <a href="userhistory.html">History</a>
        <a href="userprofile.html">Profile</a>
        <a href="index.html" class="nav-cta">Logout</a>
      </nav>
    </div>
  </header>

  <main>
    <h2>My Cart</h2>

    <!-- Cart items will be loaded here -->
    <div id="cartContainer">
      <div style="text-align: center; padding: 40px; color: #777;">
        <p>Loading cart...</p>
      </div>
    </div>

    <!-- Total box -->
    <div id="totalBox" class="total-box" style="display: none;">
      <!-- Total will be calculated here -->
    </div>
  </main>

  <!-- Firebase Scripts -->
  <script type="module" src="firebase-config.js"></script>
  <script type="module" src="usercart.js"></script>

  <script>
    // Glass nav: darken on scroll (consistent with index.html / meals.html)
    const siteHeader = document.getElementById('siteHeader');
    window.addEventListener('scroll', () => {
      siteHeader.classList.toggle('scrolled', window.scrollY > 10);
    }, { passive: true });
  </script>

</body>

</html>
