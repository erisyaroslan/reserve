<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>ReServe | Add New Meal</title>
    <link rel="icon" type="image/png" href="image/favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
    
    <style>
        :root {
            --deep-green: #0F3D2E;
            --darker-green: #1B4332;
            --primary-green: #2E7D32;
            --green: #2F8F4E;
            --accent-green: #52B788;
            --soft-green: #74C69D;
            --mint: #B7E4C7;
            --light-green: #EAF6EE;
            --cream: #F6FBF5;
            --text-dark: #16271E;
            --muted: #5C7066;
            --white: #ffffff;
            --glass: rgba(255, 255, 255, 0.78);
            --radius-lg: 28px;
            --shadow-sm: 0 8px 24px rgba(15, 61, 46, 0.06);
            --shadow-md: 0 18px 50px rgba(15, 61, 46, 0.10);
            --shadow-lg: 0 30px 70px rgba(15, 61, 46, 0.16);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--deep-green);
            background-attachment: fixed;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -1;
            background:
                radial-gradient(900px 600px at 88% -8%, rgba(82, 183, 136, 0.28), transparent 60%),
                radial-gradient(800px 700px at -10% 12%, rgba(46, 143, 78, 0.30), transparent 55%),
                radial-gradient(1200px 900px at 50% 120%, rgba(11, 41, 29, 0.55), transparent 60%),
                linear-gradient(180deg, var(--cream) 0%, var(--light-green) 100%);
        }

        /* HEADER (Glass pill style - no scroll behavior) */
        header.site {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 2000;
        }

        .nav-inner {
            max-width: 1240px;
            margin: 14px auto 0;
            width: calc(100% - 48px);
            height: 70px;
            padding: 0 14px 0 26px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-radius: 22px;
            background: linear-gradient(135deg, rgba(15, 61, 46, 0.92), rgba(27, 67, 50, 0.92));
            border: 1px solid rgba(255, 255, 255, 0.14);
            backdrop-filter: blur(18px) saturate(140%);
            -webkit-backdrop-filter: blur(18px) saturate(140%);
            box-shadow: var(--shadow-md);
        }

        .logo {
            font-family: "Playfair Display", serif;
            font-size: 1.6rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }

        .logo .leaf {
            width: 30px;
            height: 30px;
            display: grid;
            place-items: center;
            border-radius: 9px;
            background: linear-gradient(135deg, var(--accent-green), var(--primary-green));
            color: #fff;
            font-size: 1rem;
            box-shadow: 0 6px 14px rgba(46, 125, 50, 0.35);
        }

        nav.menu {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        nav.menu a {
            color: rgba(255, 255, 255, 0.88);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.92rem;
            padding: 9px 16px;
            border-radius: 12px;
            transition: all 0.25s ease;
        }

        nav.menu a:hover {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
        }

        .edit-wrapper {
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            max-width: 1100px;
            margin: 110px auto 80px;
            gap: 35px;
            padding: 0 20px;
            align-items: start;
        }

        .preview-pane {
            position: sticky;
            top: 110px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: var(--radius-lg);
            border: 1px solid rgba(255, 255, 255, 0.6);
            text-align: center;
            box-shadow: var(--shadow-sm);
        }

        .preview-pane h3 {
            font-family: 'Playfair Display', serif;
            font-size: 1.4rem;
            color: var(--darker-green);
            margin-bottom: 20px;
        }

        .meal-card-mockup {
            background: white;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
            text-align: left;
        }

        .mock-img {
            width: 100%;
            height: 160px;
            background: #f0f0f0;
            background-size: cover;
            background-position: center;
        }

        .form-pane {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 35px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        .form-pane h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            color: var(--darker-green);
            margin-bottom: 5px;
        }

        .sub-title {
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 25px;
        }

        .file-upload-box {
            background: #FAFAFA;
            border: 1px solid #EAEAEA;
            border-radius: 10px;
            padding: 12px;
        }

        input[type="text"],
        input[type="number"],
        textarea,
        select {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #EAEAEA;
            background: #FAFAFA;
            font-size: 0.9rem;
        }

        .price-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .action-btns {
            display: flex;
            gap: 12px;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #f5f5f5;
        }

        .btn-add {
            flex: 2;
            background: var(--darker-green);
            color: white;
            padding: 14px;
            border-radius: 12px;
            border: none;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-remove {
            flex: 1;
            background: #FFF0F0;
            color: #D32F2F;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.85rem;
            border: none;
            cursor: pointer;
        }

        /* Location Section Styles */
        .location-area { margin-bottom: 22px; }
        .location-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .location-header label {
            font-size: 0.65rem;
            font-weight: 800;
            color: var(--darker-green);
        }
        #vendorLocationMap {
            width: 100%;
            height: 280px;
            border-radius: 18px;
            border: 1px solid #EAEAEA;
            background: #eee;
        }
        .current-location-btn {
            border: none;
            background: var(--darker-green);
            color: white;
            padding: 8px 14px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.75rem;
            cursor: pointer;
        }
        .location-preview {
            margin-top: 12px;
            background: #F7FAF8;
            border: 1px solid #E6F4EA;
            border-radius: 14px;
            padding: 14px;
            font-size: 0.85rem;
            color: #2F5233;
        }

        /* Custom Swal Styles */
        .premium-popup { border-radius: 25px !important; }
        .premium-confirm-btn { 
            background: var(--darker-green) !important; 
            color: white !important; 
            border-radius: 10px !important; 
            padding: 10px 25px !important;
        }
    </style>
</head>

<body>
    <header class="site">
        <div class="nav-inner">
            <a href="vendordashboard.html" class="logo">
                <span class="leaf">r.</span> ReServe
            </a>
            <nav class="menu">
                <a href="vendordashboard.html">Back to Dashboard</a>
            </nav>
        </div>
    </header>

    <div class="edit-wrapper">
        <aside class="preview-pane">
            <h3>Live Preview</h3>
            <div class="meal-card-mockup">
                <div class="mock-img" id="prevImg" style="background-image: url('image/nasilemak.jpg');"></div>
                <div class="mock-details" style="padding: 15px;">
                    <p id="prevCat" style="font-size: 0.65rem; font-weight: 800; color: var(--primary-green); text-transform: uppercase;">SNACKS</p>
                    <h4 id="prevName" style="font-size: 1.1rem; color: #333; margin: 5px 0;">Meal Name</h4>
                    <p id="prevDesc" style="font-size: 0.8rem; color: #777; height: 2.5em; overflow: hidden; margin-bottom: 15px;">Description preview...</p>
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <div>
                            <span id="prevOld" style="text-decoration: line-through; color: #bbb; font-size: 0.8rem; margin-right: 5px;">RM 0.00</span>
                            <span id="prevNew" style="font-weight: 800; color: var(--darker-green); font-size: 1.1rem;">RM 0.00</span>
                        </div>
                        <span id="prevQty" style="font-size: 0.7rem; background: #E8F5E9; padding: 4px 8px; border-radius: 5px; color: var(--primary-green);">0 Left</span>
                    </div>
                </div>
            </div>
        </aside>

        <main class="form-pane">
            <h1>Post a New Meal</h1>
            <p class="sub-title">Enter details to add your surplus food.</p>

            <form id="addMealForm">
                <div style="margin-bottom: 18px;">
                    <label style="display: block; font-size: 0.65rem; font-weight: 800; color: var(--darker-green); margin-bottom: 8px;">MEAL PHOTO</label>
                    <div class="file-upload-box">
                        <input type="file" id="mealImageInput" accept="image/*" onchange="updatePreviewImage(this)">
                    </div>
                </div>

                <div style="margin-bottom: 18px;">
                    <label style="display: block; font-size: 0.65rem; font-weight: 800; color: var(--darker-green); margin-bottom: 8px;">MEAL NAME</label>
                    <input type="text" id="mealName" placeholder="e.g. Egg Mayo Sandwich" oninput="updatePreview()" required>
                </div>

                <div style="margin-bottom: 18px;">
                    <label style="display: block; font-size: 0.65rem; font-weight: 800; color: var(--darker-green); margin-bottom: 8px;">CATEGORY</label>
                    <select id="category" onchange="updatePreview()">
                        <option value="Snacks">Snacks</option>
                        <option value="Hot Meal">Hot Meal</option>
                        <option value="Western">Western</option>
                    </select>
                </div>

                <div style="margin-bottom: 18px;">
                    <label style="display: block; font-size: 0.65rem; font-weight: 800; color: var(--darker-green); margin-bottom: 8px;">DESCRIPTION</label>
                    <textarea id="description" rows="3" placeholder="Brief description..." oninput="updatePreview()"></textarea>
                </div>

                <div class="price-grid">
                    <div style="margin-bottom: 18px;">
                        <label style="display: block; font-size: 0.65rem; font-weight: 800; color: var(--darker-green); margin-bottom: 8px;">ORIGINAL (RM)</label>
                        <input type="number" id="oldPrice" placeholder="5.00" step="0.01" oninput="updatePreview()">
                    </div>
                    <div style="margin-bottom: 18px;">
                        <label style="display: block; font-size: 0.65rem; font-weight: 800; color: var(--darker-green); margin-bottom: 8px;">SURPLUS (RM)</label>
                        <input type="number" id="newPrice" placeholder="3.00" step="0.01" oninput="updatePreview()" style="color: var(--primary-green); font-weight: 800;">
                    </div>
                </div>

                <div style="margin-bottom: 18px;">
                    <label style="display: block; font-size: 0.65rem; font-weight: 800; color: var(--darker-green); margin-bottom: 8px;">QUANTITY</label>
                    <input type="number" id="qty" placeholder="10" oninput="updatePreview()">
                </div>

                <div class="location-area">
                    <div class="location-header">
                        <label>STALL LOCATION</label>
                        <button type="button" id="useCurrentLocationBtn" class="current-location-btn">Locate your location</button>
                    </div>
                    <div style="margin-bottom: 10px;">
                        <input type="text" id="stallAddress" placeholder="Enter Stall/Vendor Name (e.g. Kak Kiah Nasi Lemak)">
                    </div>
                    <div id="vendorLocationMap"></div>
                    <div class="location-preview" id="locationPreview">Tap the map to pin your location.</div>
                </div>

                <div class="action-btns">
                    <button type="button" class="btn-add" id="saveMealBtn">Add New Meal</button>
                    <button type="button" class="btn-remove" onclick="history.back()">Cancel</button>
                </div>
            </form>
        </main>
    </div>

    <script>
        function updatePreview() {
            document.getElementById('prevName').innerText = document.getElementById('mealName').value || "Meal Name";
            document.getElementById('prevCat').innerText = document.getElementById('category').value;
            document.getElementById('prevDesc').innerText = document.getElementById('description').value || "Description preview...";
            document.getElementById('prevOld').innerText = "RM " + parseFloat(document.getElementById('oldPrice').value || 0).toFixed(2);
            document.getElementById('prevNew').innerText = "RM " + parseFloat(document.getElementById('newPrice').value || 0).toFixed(2);
            document.getElementById('prevQty').innerText = (document.getElementById('qty').value || 0) + " Left";
        }

        function updatePreviewImage(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    document.getElementById('prevImg').style.backgroundImage = `url(${e.target.result})`;
                }
                reader.readAsDataURL(input.files[0]);
            }
        }
    </script>

    <script type="module" src="addmenu-logic.js"></script>
    <!-- REPLACE YOUR_API_KEY WITH YOUR ACTUAL GOOGLE API KEY -->
   <!-- Add &loading=async and remove YOUR_API_KEY with your real key -->
<script  async
  defer
  src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBKiMQHafUNOXBXPeppGmLsX8PnQjNIQCA&callback=initVendorLocationMap&libraries=marker"></script>
</body>
</html>
